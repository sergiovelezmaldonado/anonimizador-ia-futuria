// ─── Money range formatter ────────────────────────────────────────────────────
function formatMoneyRange(value) {
  const cleaned = String(value).replace(/\./g, '').replace(/,/g, '.');
  const n = parseFloat(cleaned);
  if (isNaN(n)) return null;
  const low = Math.max(0, Math.round(n * 0.90));
  const high = Math.round(n * 1.10);
  const fmt = v => new Intl.NumberFormat('es-ES').format(v);
  return '$~' + fmt(low) + '–' + fmt(high);
}

// ─── Lógica de anonimización ──────────────────────────────────────────────────
function runAnonymize(text, activeCats, customTerms) {
  const reps = [];
  let out = text;
  const counters = {};

  for (const cat of activeCats) {
    counters[cat.id] = 0;
    for (const pat of cat.pats) {
      pat.lastIndex = 0;
      out = out.replace(pat, (match) => {
        if (/^\[[^\]]+_\d+\]$/.test(match.trim())) return match;
        counters[cat.id]++;
        const tag = '[' + cat.tag + '_' + counters[cat.id] + ']';

        let hint = null;
        if (cat.id === 'money') {
          const numPart = match.replace(/[$\s]/g, '');
          hint = formatMoneyRange(numPart);
        }

        reps.push({ original: match, replacement: tag, catId: cat.id, catLabel: cat.label, hint });
        return tag;
      });
    }
  }

  if (customTerms && customTerms.trim()) {
    const terms = [...new Set(
      customTerms.split('\n').map(t => t.trim()).filter(t => t.length >= 2)
    )];
    counters['custom'] = 0;
    for (const term of terms) {
      const esc = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const pat = new RegExp(esc, 'gi');
      out = out.replace(pat, (match) => {
        if (/^\[[^\]]+_\d+\]$/.test(match.trim())) return match;
        counters['custom']++;
        const tag = '[PERSONALIZADO_' + counters['custom'] + ']';
        reps.push({ original: match, replacement: tag, catId: 'custom', catLabel: 'Término personalizado', hint: null });
        return tag;
      });
    }
  }

  return { out, reps };
}

  { id: 'credentials', label: 'Credenciales', weight: 50, pats: [/(sk_live|sk_test|api[_-]?key|bearer|password|contraseña)[\s:=]+['"]?[A-Za-z0-9_\-.]{8,}['"]?/gi] },

  { id: 'financial', label: 'Cuentas', weight: 25, pats: [/\b[A-Z]{2}\d{2}[\s\-]?(?:\d{4}[\s\-]?){4,6}\b/gi] },
  { id: 'ip', label: 'IPs', weight: 15, pats: [/\b(?:\d{1,3}\.){3}\d{1,3}\b/g] },
  { id: 'phone', label: 'Teléfonos', weight: 15, pats: [/\+\d{1,3}[\s\-]?\d{3,4}[\s\-]?\d{3,4}/g] },
  { id: 'fiscal', label: 'IDs fiscales', weight: 20, pats: [/\b[A-Z]{3,4}\d{6}[A-Z0-9]{3}\b/gi] },
];

function computeResidualRisk(text) {
  if (!text) return { score: 0, hits: [] };
  let score = 0;
  const hits = [];
  for (const check of RISK_CHECKS) {
    for (const pat of check.pats) {
      pat.lastIndex = 0;
      if (pat.test(text)) {
        score += check.weight;
        hits.push(check.label);
        break;
      }
    }
  }
  return { score: Math.min(100, score), hits };
}

function getRiskInfo(score) {
  if (score >= 60) return { label: 'Alto riesgo', emoji: '🔴', color: '#dc2626', bg: '#fef2f2', border: '#fecaca' };
  if (score >= 20) return { label: 'Revisar antes de usar', emoji: '🟡', color: '#d97706', bg: '#fffbeb', border: '#fcd34d' };
  return { label: 'Listo para usar', emoji: '🟢', color: '#16a34a', bg: '#f0fdf4', border: '#bbf7d0' };
}

// ─── Output con highlights ────────────────────────────────────────────────────
function HighlightedOutput({ text, reps, cats }) {
  const catMap = {};
  cats.forEach(c => { catMap[c.id] = c; });
  const repMap = {};
  reps.forEach(r => { repMap[r.replacement] = r; });

  const tagPattern = /(\[[A-Z_]+_\d+\])/g;
  const parts = text.split(tagPattern);

  return (
    <pre className="whitespace-pre-wrap break-words font-mono text-sm leading-relaxed text-[#222222]">
      {parts.map((part, i) => {
        const rep = repMap[part];
        if (rep) {
          const cat = catMap[rep.catId];
          if (!cat) return <span key={i}>{part}</span>;
          const label = rep.hint ? part + ' (' + rep.hint + ')' : part;
          return (
            <mark key={i} className="anon cursor-default"
              title={'Original: ' + rep.original + (rep.hint ? ' → ' + rep.hint : '')}
              style={{ backgroundColor: cat.bg, color: cat.color, border: '1px solid ' + cat.border }}>
              {label}
            </mark>
          );
        }
        return <span key={i}>{part}</span>;
      })}
    </pre>
  );
}

// Sin límite, un PDF de cientos de páginas congela la pestaña sin explicar nada:
// el navegador deja de responder y el usuario no sabe si falló o sigue trabajando.
const MAX_FILE_MB = 25;
const MAX_FILE_BYTES = MAX_FILE_MB * 1024 * 1024;
const MAX_PDF_PAGES = 300;
const AVISO_PAGINAS = 40;   // a partir de aquí se avisa de que tardará

function formatMB(bytes) {
  return (bytes / (1024 * 1024)).toFixed(1).replace('.', ',') + ' MB';
}

// ─── Reconstrucción del texto de una página de PDF ───────────────────────────
// pdf.js entrega fragmentos sueltos con su posición en la página. Unirlos todos
// con espacios (`items.map(i => i.str).join(' ')`) aplasta el documento entero en
// una sola línea: el visor reparte párrafos por línea en blanco y, sin saltos, un
// documento de 12 páginas sale como un único bloque ilegible.
// Aquí se agrupan los fragmentos por coordenada vertical (cada Y distinta es una
// línea) y se infiere el salto de párrafo cuando el hueco entre líneas supera de
// forma clara el interlineado normal.
function reconstructPageText(items) {
  if (!items || !items.length) return '';

  const lineas = [];
  let actual = null;
  for (const item of items) {
    const str = item.str;
    if (typeof str !== 'string') continue;
    // transform = [a, b, c, d, e, f]; f es la coordenada Y del fragmento.
    const y = item.transform ? item.transform[5] : 0;
    const alto = item.height || Math.abs(item.transform ? item.transform[3] : 12) || 12;

    if (actual && Math.abs(actual.y - y) <= Math.max(2, alto * 0.5)) {
      // mismo renglón: pdf.js ya marca con hasEOL dónde termina la línea real
      actual.partes.push(str);
    } else {
      if (actual) lineas.push(actual);
      actual = { y: y, alto: alto, partes: [str] };
    }
    if (item.hasEOL) {
      lineas.push(actual);
      actual = null;
    }
  }
  if (actual) lineas.push(actual);

  // Texto de cada línea, sin introducir espacios donde el PDF no los tiene.
  const textos = lineas.map(l => l.partes.join('').replace(/\s+/g, ' ').trim());

  // Interlineado típico de la página: la mediana de los saltos verticales.
  const saltos = [];
  for (let i = 1; i < lineas.length; i++) {
    const d = Math.abs(lineas[i - 1].y - lineas[i].y);
    if (d > 0.5) saltos.push(d);
  }
  saltos.sort((a, b) => a - b);
  const interlineado = saltos.length ? saltos[Math.floor(saltos.length / 2)] : 0;

  let out = '';
  for (let i = 0; i < lineas.length; i++) {
    const texto = textos[i];
    if (i === 0) { out = texto; continue; }
    const salto = Math.abs(lineas[i - 1].y - lineas[i].y);
    // Hueco claramente mayor que el interlineado = párrafo nuevo.
    const nuevoParrafo = interlineado > 0 && salto > interlineado * 1.6;
    if (!texto) { out += '\n'; continue; }
    out += (nuevoParrafo ? '\n\n' : '\n') + texto;
  }

  // Normalizar: nunca más de una línea en blanco seguida.
  return out.replace(/\n{3,}/g, '\n\n').trim();
}

// ─── Document Body (párrafos con highlights, para el visor) ──────────────────
function DocumentBody({ text, reps, cats, showMarks }) {
  const catMap = {};
  cats.forEach(c => { catMap[c.id] = c; });
  const repMap = {};
  reps.forEach(r => { repMap[r.replacement] = r; });
  const tagPattern = /(\[[A-Z_]+_\d+\])/g;

  const renderInline = (para, paraIdx) => {
    const parts = para.split(tagPattern);
    return (
      <p key={paraIdx} style={{ marginBottom: '1.1em', lineHeight: '1.75', fontSize: '11pt', color: '#222', whiteSpace: 'pre-wrap' }}>
        {parts.map((part, i) => {
          const rep = repMap[part];
          if (rep) {
            const cat = catMap[rep.catId];
            if (!cat) return <span key={i}>{part}</span>;
            const label = rep.hint ? part + ' (' + rep.hint + ')' : part;
            if (!showMarks) return <span key={i} style={{ fontFamily: 'monospace', fontSize: '0.88em' }}>{label}</span>;
            return (
              <mark key={i}
                title={'Original: ' + rep.original + (rep.hint ? ' → ' + rep.hint : '')}
                style={{ backgroundColor: cat.bg, color: cat.color, border: '1px solid ' + cat.border, borderRadius: '4px', padding: '0 3px', cursor: 'default', fontFamily: 'monospace', fontSize: '0.88em' }}>
                {label}
              </mark>
            );
          }
          return <span key={i}>{part}</span>;
        })}
      </p>
    );
  };

  const paragraphs = text.split(/\n\n+/);
  return (
    <div>
      {paragraphs.map((para, i) => para.trim() ? renderInline(para, i) : <br key={i} />)}
    </div>
  );
}

// ─── Descarga Word (.doc) ─────────────────────────────────────────────────────
function escXml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function downloadWordDoc(filename, title, bodyHtml) {
  const doc = [
    '<html xmlns:o="urn:schemas-microsoft-com:office:office"',
    '      xmlns:w="urn:schemas-microsoft-com:office:word"',
    '      xmlns="http://www.w3.org/TR/REC-html40">',
    '<head>',
    '<meta charset="UTF-8">',
    '<title>' + escXml(title) + '</title>',
    '<style>',
    '  @page WordSection1 {',
    '    size: 595.3pt 841.9pt;',
    '    margin: 2.5cm 3cm 2.5cm 3cm;',
    '    mso-header-margin: 1cm;',
    '    mso-footer-margin: 1cm;',
    '  }',
    '  div.WordSection1 { page: WordSection1; }',
    '  body { font-family: Calibri, sans-serif; font-size: 11pt; color: #1f1f1f; margin: 0; padding: 0; }',
    '  p { margin: 0 0 8pt 0; padding: 0; line-height: 1.5; font-size: 11pt; }',
    '  h1 { font-family: Calibri, sans-serif; font-size: 22pt; color: #b00020; font-weight: bold; margin: 0 0 6pt 0; padding: 0; }',
    '  h2 { font-family: Calibri, sans-serif; font-size: 10pt; color: #b00020; font-weight: bold; margin: 18pt 0 6pt 0; padding: 0 0 3pt 0; border-bottom: 1pt solid #b00020; }',
    '  .meta { font-size: 8pt; color: #888888; line-height: 1.6; margin: 0 0 12pt 0; padding: 0 0 10pt 0; border-bottom: 1pt solid #dddddd; }',
    '  .instr { font-size: 9pt; color: #333333; line-height: 1.65; margin: 0 0 16pt 0; padding: 8pt 14pt; background: #f9f9f9; border-left: 3pt solid #b00020; mso-border-left-alt: solid #b00020 3.0pt; }',
    '  .note { font-size: 8.5pt; color: #666666; font-style: italic; margin: 0 0 18pt 0; }',
    '  table { border-collapse: collapse; width: 100%; font-size: 9pt; margin: 0 0 16pt 0; mso-table-lspace: 0; mso-table-rspace: 0; }',
    '  th { background: #b00020; color: #ffffff; border: 1pt solid #9a001a; padding: 5pt 8pt; font-size: 8.5pt; font-weight: bold; text-align: left; }',
    '  td { border: 1pt solid #cccccc; padding: 4pt 8pt; vertical-align: top; font-size: 9pt; line-height: 1.4; }',
    '  tr.alt td { background: #f5f5f5; }',
    '  .tag { font-family: "Courier New", monospace; font-size: 8.5pt; }',
    '  .body-p { font-size: 11pt; line-height: 1.65; margin: 0 0 10pt 0; text-align: justify; }',
    '  .footer { font-size: 7.5pt; color: #aaaaaa; margin: 28pt 0 0 0; padding: 8pt 0 0 0; border-top: 1pt solid #dddddd; }',
    '</style>',
    '</head>',
    '<body><div class="WordSection1">' + bodyHtml + '</div></body></html>',
  ].join('\n');

  const blob = new Blob(['﻿' + doc], { type: 'application/msword;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename + '.doc';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ─── Descarga combinada: tabla de equivalencias (pág. 1) + texto anonimizado ──
function downloadCombinedDoc({ anonText, reps, cats, activeCats, riskScore, riskLabel, timestamp, originalLen }) {
  const dateStr = new Date().toISOString().slice(0, 10);
  const catMap = {};
  cats.forEach(c => { catMap[c.id] = c; });
  const countByCat = {};
  activeCats.forEach(c => { countByCat[c.id] = 0; });
  reps.forEach(r => { if (countByCat[r.catId] !== undefined) countByCat[r.catId]++; });
  const riskEmoji = riskScore >= 60 ? '🔴' : riskScore >= 20 ? '🟡' : '🟢';

  const tableRows = reps.map((r, idx) => {
    const cat = catMap[r.catId];
    const tagStyle = cat ? 'background:' + cat.bg + ';color:' + cat.color + ';border:1pt solid ' + cat.border + ';padding:0 3pt;' : '';
    const rowClass = idx % 2 === 1 ? ' class="alt"' : '';
    return '<tr' + rowClass + '>' +
      '<td><span class="tag" style="' + tagStyle + '">' + escXml(r.replacement) + '</span></td>' +
      '<td>' + escXml(r.original) + '</td>' +
      '<td>' + escXml(r.hint || '—') + '</td>' +
      '<td>' + escXml(r.catLabel) + '</td>' +
      '</tr>';
  }).join('\n');

  const summaryRows = activeCats.map((c, idx) => {
    const rowClass = idx % 2 === 1 ? ' class="alt"' : '';
    return '<tr' + rowClass + '><td>' + escXml(c.label) + '</td><td><span class="tag">[' + escXml(c.tag) + '_N]</span></td><td>' + (countByCat[c.id] || 0) + '</td></tr>';
  }).join('\n');

  const anonParas = anonText.split(/\n\n+/).map(p => p.trim()).filter(p => p)
    .map(p => '<p class="body-p">' + escXml(p).replace(/\n/g, '<br>') + '</p>').join('\n');

  const body = [
    // ── Página 1: Tabla de equivalencias ──
    '<h1>Tabla de equivalencias</h1>',
    '<p class="meta">FuturIA Anonimizador IA &nbsp;&middot;&nbsp; ' + escXml(timestamp) + '<br>',
    'Total de reemplazos: <strong>' + reps.length + '</strong> &nbsp;&middot;&nbsp; Riesgo residual: ' + riskEmoji + ' ' + escXml(riskLabel) + ' (' + riskScore + '%)</p>',
    '<div class="instr">',
    '<p style="margin:0 0 6pt 0;"><strong>¿Qué es esta tabla?</strong> Mapeo completo entre cada etiqueta del texto anonimizado y el dato original que reemplaza. Es el único lugar donde aparecen los datos sin anonimizar.</p>',
    '<p style="margin:0 0 6pt 0;"><strong>¿Cómo usarla?</strong> Guárdala en un lugar seguro. Para recuperar el texto original, busca cada etiqueta (ej. <span class="tag">[EMAIL_1]</span>) en la página siguiente y sustitúyela por el valor de la columna "Dato original".</p>',
    '<p style="margin:0;"><strong>⚠ Confidencialidad:</strong> este archivo contiene los datos originales. Trátalo con el mismo nivel de confidencialidad que el documento fuente. No lo compartas con modelos de IA.</p>',
    '</div>',
    '<h2>Detalle de reemplazos (' + reps.length + ')</h2>',
    '<table>',
    '<tr><th>Etiqueta</th><th>Dato original</th><th>Rango / hint</th><th>Categoría</th></tr>',
    tableRows,
    '</table>',
    '<h2>Resumen por categoría</h2>',
    '<table>',
    '<tr><th>Categoría</th><th>Etiqueta</th><th>Reemplazos</th></tr>',
    summaryRows,
    '</table>',
    // ── Salto de página Word-compatible ──
    '<br clear="all" style="mso-special-character:line-break;page-break-before:always">',
    // ── Página siguiente: Texto anonimizado ──
    '<h1>Texto anonimizado</h1>',
    '<p class="meta">FuturIA Anonimizador IA &nbsp;&middot;&nbsp; ' + escXml(timestamp) + '<br>',
    'Caracteres originales: ' + originalLen.toLocaleString() + ' &nbsp;&middot;&nbsp; Anonimizados: ' + anonText.length.toLocaleString() + '<br>',
    'Riesgo residual: ' + riskEmoji + ' ' + escXml(riskLabel) + ' (' + riskScore + '%)</p>',
    '<p class="note">Texto listo para enviar a modelos de IA — datos sensibles reemplazados por etiquetas. Consulta la página anterior para recuperar los datos originales.</p>',
    anonParas,
    '<p class="footer">Procesado 100% en navegador &mdash; sin servidores, sin almacenamiento. &nbsp; futuria.substack.com</p>',
  ].join('\n');

  downloadWordDoc('anonimizado-' + dateStr, 'Anonimizador IA — FuturIA', body);
}

// ─── Visor de documento modal ─────────────────────────────────────────────────
function DocumentViewer({ open, onClose, anonText, reps, cats, activeCats, fileName, originalLen }) {
  const [showMarks, setShowMarks] = React.useState(true);
  if (!open) return null;

  const riskData = computeResidualRisk(anonText);
  const riskInfo = getRiskInfo(riskData.score);
  const canExport = riskData.score < 60;

  const handlePrint = () => {
    const catMap = {};
    cats.forEach(c => { catMap[c.id] = c; });
    const repMap = {};
    reps.forEach(r => { repMap[r.replacement] = r; });
    const tagPattern = /(\[[A-Z_]+_\d+\])/g;

    const paragraphsHtml = anonText.split(/\n\n+/).filter(p => p.trim()).map(para => {
      const parts = para.split(tagPattern);
      const inner = parts.map(part => {
        const rep = repMap[part];
        if (rep) {
          const cat = catMap[rep.catId];
          const label = rep.hint ? part + ' (' + rep.hint + ')' : part;
          if (cat) return '<mark style="background-color:' + cat.bg + ';color:' + cat.color + ';border:1px solid ' + cat.border + ';border-radius:4px;padding:0 3px;font-family:monospace;font-size:0.88em">' + escXml(label) + '</mark>';
        }
        return escXml(part);
      }).join('');
      return '<p style="margin-bottom:1.1em;line-height:1.75;white-space:pre-wrap;mso-line-height-rule:exactly">' + inner + '</p>';
    }).join('');

    const dateStr = new Date().toLocaleString('es');
    const printHtml = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Documento Anonimizado — FuturIA</title><style>' +
      'body{font-family:Arial,sans-serif;font-size:11pt;color:#222;margin:2.5cm 3cm}' +
      'h1{font-size:16pt;color:#b00020;margin-bottom:6pt}' +
      '.meta{font-size:9pt;color:#757575;margin-bottom:20pt;border-bottom:1px solid #e5e5e5;padding-bottom:8pt}' +
      '.footer{margin-top:32pt;font-size:8pt;color:#aaa;border-top:1px solid #e5e5e5;padding-top:8pt}' +
      '</style></head><body>' +
      '<h1>Documento Anonimizado</h1>' +
      '<div class="meta">FuturIA Anonimizador IA &nbsp;·&nbsp; ' + escXml(dateStr) + '<br>' +
      'Archivo: ' + escXml(fileName || 'documento') + ' &nbsp;·&nbsp; ' +
      'Riesgo residual: ' + riskInfo.emoji + ' ' + escXml(riskInfo.label) + ' (' + riskData.score + '%)</div>' +
      paragraphsHtml +
      '<div class="footer">Procesado 100% en navegador — sin servidores, sin almacenamiento. futuria.substack.com</div>' +
      '</body></html>';

    const win = window.open('', '_blank');
    if (!win) { alert('El navegador bloqueó la ventana emergente. Permite pop-ups para esta página e inténtalo de nuevo.'); return; }
    win.document.write(printHtml);
    win.document.close();
    setTimeout(() => win.print(), 500);
  };

  const handleDownload = () => {
    downloadCombinedDoc({
      anonText,
      reps,
      cats,
      activeCats,
      riskScore: riskData.score,
      riskLabel: riskInfo.label,
      timestamp: new Date().toLocaleString('es'),
      originalLen: originalLen || anonText.length,
    });
  };

  return (
    <div className="fixed inset-0 z-50 flex flex-col" style={{ backgroundColor: '#f0f0f0' }} role="dialog" aria-modal="true">
      {/* Toolbar */}
      <div className="shrink-0 border-b border-[#e5e5e5] bg-white shadow-sm">
        <div className="flex flex-wrap items-center gap-2 px-5 py-3">
          <button onClick={onClose}
            className="flex items-center gap-1.5 rounded-xl border border-[#e5e5e5] px-3 py-2 text-sm font-semibold text-[#333333] hover:bg-[#fff5f6] transition">
            ← Cerrar
          </button>
          <div className="mx-2 h-5 w-px bg-[#e5e5e5]" />
          <span className="text-sm font-semibold" style={{ color: riskInfo.color }}>{riskInfo.emoji} {riskInfo.label} ({riskData.score}%)</span>
          {fileName && <span className="hidden text-xs text-[#757575] sm:inline">· {fileName}</span>}
          <div className="flex-1" />
          <button
            onClick={() => setShowMarks(v => !v)}
            className={cn('rounded-xl border px-3 py-2 text-xs font-semibold transition',
              showMarks ? 'border-[#b00020] bg-[#fff5f6] text-[#b00020]' : 'border-[#e5e5e5] bg-white text-[#757575] hover:bg-[#fafafa]')}>
            {showMarks ? '● Con marcas' : '○ Sin marcas'}
          </button>
          <button onClick={handlePrint}
            className="flex items-center gap-1.5 rounded-xl border border-[#e5e5e5] bg-white px-3 py-2 text-xs font-semibold text-[#333333] hover:bg-[#fff5f6] transition">
            🖨 Imprimir
          </button>
          <AppButton onClick={handleDownload} disabled={!canExport} className="text-xs">
            ↓ Descargar .doc
          </AppButton>
        </div>
        {!canExport && (
          <div className="border-t border-[#fecaca] bg-[#fef2f2] px-5 py-2 text-xs font-semibold text-[#dc2626]">
            🔴 Exportación deshabilitada — riesgo residual {riskData.score}%. Activa más categorías y vuelve a anonimizar.
          </div>
        )}
      </div>

      {/* Paper scroll area */}
      <div className="flex-1 overflow-y-auto py-8 px-4">
        <div className="mx-auto max-w-3xl rounded-sm bg-white shadow-xl" style={{ padding: '3cm 3.5cm', minHeight: '27cm' }}>
          {/* Doc header */}
          <div className="mb-6 border-b border-[#e5e5e5] pb-4">
            <div className="text-xs text-[#aaaaaa]">FuturIA Anonimizador IA &nbsp;·&nbsp; {new Date().toLocaleDateString('es')}</div>
            {fileName && <div className="mt-0.5 text-xs text-[#aaaaaa]">Archivo: {fileName}</div>}
          </div>

          {/* Body */}
          <DocumentBody text={anonText} reps={reps} cats={cats} showMarks={showMarks} />

          {/* Doc footer */}
          <div className="mt-8 border-t border-[#e5e5e5] pt-4 text-xs text-[#aaaaaa]">
            Procesado 100% en navegador — sin servidores, sin almacenamiento. &nbsp; futuria.substack.com
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Extracción de texto de archivos ─────────────────────────────────────────

async function loadPdfJs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = window.PDFJS_CDN;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  // Fetch worker and create a blob URL to avoid CORS issues when running from file://
  try {
    const resp = await fetch(window.PDFJS_WORKER);
    if (resp.ok) {
      const text = await resp.text();
      const blob = new Blob([text], { type: 'application/javascript' });
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
    } else {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = window.PDFJS_WORKER;
    }
  } catch (_) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = window.PDFJS_WORKER;
  }
  return window.pdfjsLib;
}

async function loadMammoth() {
  if (window.mammoth) return window.mammoth;
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = window.MAMMOTH_CDN;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return window.mammoth;
}

async function extractTextFromFile(file, onProgress) {
  if (file.size > MAX_FILE_BYTES) {
    throw new Error(
      'El archivo pesa ' + formatMB(file.size) + ' y el máximo admitido es ' + MAX_FILE_MB + ' MB.\n\n' +
      'Todo el procesamiento ocurre en tu navegador, así que un archivo muy grande lo dejaría sin responder. ' +
      'Divide el documento o copia y pega el texto en la pestaña Texto.'
    );
  }
  if (file.size === 0) {
    throw new Error('El archivo está vacío (0 bytes).');
  }
  const ext = file.name.toLowerCase().split('.').pop();

  if (ext === 'txt' || ext === 'csv') {
    return await file.text();
  }

  if (ext === 'pdf') {
    onProgress('Cargando motor PDF…');
    const pdfjsLib = await loadPdfJs();
    const arrayBuffer = await file.arrayBuffer();
    onProgress('Abriendo documento PDF…');
    let pdf;
    try {
      pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    } catch (e) {
      throw new Error(
        'No se pudo abrir el PDF. Posibles causas: archivo protegido con contraseña, PDF corrupto o formato no estándar.\n\n' +
        'Alternativa: abre el PDF, selecciona todo (Ctrl+A), copia y pega el texto directamente en el área de texto.'
      );
    }
    const totalPages = pdf.numPages;
    if (totalPages > MAX_PDF_PAGES) {
      throw new Error(
        'El PDF tiene ' + totalPages + ' páginas y el máximo admitido es ' + MAX_PDF_PAGES + '.\n\n' +
        'Un documento tan largo bloquearía el navegador durante la extracción. ' +
        'Divídelo en partes y anonimiza cada una por separado.'
      );
    }
    let fullText = '';
    if (totalPages >= AVISO_PAGINAS) {
      onProgress('Documento de ' + totalPages + ' páginas — la extracción puede tardar…');
    }
    for (let i = 1; i <= totalPages; i++) {
      onProgress('Extrayendo página ' + i + ' de ' + totalPages + '…');
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += reconstructPageText(content.items);
      // Separador de página: línea en blanco, para que el visor abra párrafo nuevo.
      if (i < totalPages) fullText += '\n\n';
      // Ceder el hilo cada pocas páginas para que la interfaz siga respondiendo
      // y el contador de progreso se repinte de verdad en documentos largos.
      if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
    }
    const trimmed = fullText.trim();
    if (!trimmed) {
      throw new Error(
        'El PDF no contiene texto seleccionable — es un PDF escaneado (solo imágenes).\n\n' +
        'Alternativa: usa Adobe Acrobat, Google Docs o un OCR online para convertirlo a texto, ' +
        'luego pégalo aquí manualmente.'
      );
    }
    return trimmed;
  }

  if (ext === 'docx' || ext === 'doc') {
    onProgress('Cargando motor Word…');
    const mammoth = await loadMammoth();
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer });
    return result.value;
  }

  throw new Error('Formato no compatible: .' + ext + '. Usa PDF, DOCX, DOC, TXT o CSV.');
}

function TemplatesPanel({ onSelect, onClose }) {
  const [search, setSearch] = React.useState('');
  const [activeCat, setActiveCat] = React.useState('all');

  const filtered = TEMPLATES.filter(t => {
    const matchCat = activeCat === 'all' || t.cat === activeCat;
    const q = search.toLowerCase();
    const matchSearch = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });

  const catDef = TEMPLATE_CATS.find(c => c.id === activeCat);

  // Cerrar con Escape, como cualquier ventana emergente.
  React.useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    // Bloquear el scroll del fondo mientras la ventana está abierta.
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, [onClose]);

  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
      role="dialog" aria-modal="true" aria-label="Plantillas de ejemplo"
      onClick={onClose}
    >
      <div
        className="flex max-h-[88vh] w-full max-w-5xl flex-col overflow-hidden rounded-[28px] border border-[#e5e5e5] bg-white shadow-2xl"
        onClick={e => e.stopPropagation()}
      >
        {/* Header */}
        <div className="flex shrink-0 items-center justify-between gap-4 border-b border-[#e5e5e5] bg-[#fff5f6] px-6 py-4">
          <div>
            <h3 className="font-bold text-[#222222]">📋 Plantillas de ejemplo</h3>
            <p className="text-xs text-[#757575] mt-0.5">{TEMPLATES.length} documentos reales · Haz clic en cualquiera para cargarlo</p>
          </div>
          <button onClick={onClose} className="rounded-xl border border-[#e5e5e5] bg-white px-3 py-1.5 text-xs font-semibold text-[#757575] hover:bg-[#fafafa]">
            × Cerrar
          </button>
        </div>

        {/* Search + category filter */}
        <div className="shrink-0 border-b border-[#e5e5e5] px-6 py-3 space-y-3">
          <input
            type="text"
            value={search}
            onChange={e => setSearch(e.target.value)}
            placeholder="Buscar plantilla…"
            autoFocus
            className="w-full rounded-2xl border border-[#e5e5e5] px-4 py-2 text-sm text-[#222222] outline-none focus:border-[#b00020] transition"
          />
          <div className="flex flex-wrap gap-1.5">
            {TEMPLATE_CATS.map(c => (
              <button key={c.id} onClick={() => setActiveCat(c.id)}
                className={cn('rounded-xl px-3 py-1.5 text-xs font-semibold transition',
                  activeCat === c.id
                    ? 'bg-[#b00020] text-white'
                    : 'border border-[#e5e5e5] bg-white text-[#333333] hover:bg-[#fff5f6]')}>
                {c.label}
              </button>
            ))}
          </div>
        </div>

        {/* Grid: ocupa el alto libre de la ventana y desplaza solo aquí dentro */}
        <div className="min-h-0 flex-1 overflow-y-auto p-4">
        {filtered.length === 0 ? (
          <div className="py-8 text-center text-sm text-[#757575]">No se encontraron plantillas para "{search}"</div>
        ) : (
          <div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
            {filtered.map(t => (
              <button key={t.id} onClick={() => onSelect(t)}
                className="rounded-2xl border border-[#e5e5e5] bg-white p-4 text-left hover:border-[#b00020] hover:bg-[#fff5f6] transition group">
                <div className="flex items-center gap-2 mb-1.5">
                  <span className="text-xl">{t.icon}</span>
                  <span className="font-semibold text-sm text-[#222222] group-hover:text-[#b00020] transition">{t.name}</span>
                </div>
                <p className="text-xs text-[#757575] leading-relaxed">{t.desc}</p>
              </button>
            ))}
          </div>
        )}
        </div>

        {/* Pie: contador de resultados */}
        <div className="shrink-0 border-t border-[#e5e5e5] bg-[#fafafa] px-6 py-2.5 text-xs text-[#757575]">
          Mostrando {filtered.length} de {TEMPLATES.length} plantillas
          {activeCat !== 'all' && catDef ? ' · ' + catDef.label : ''}
          <span className="float-right hidden sm:inline">Esc para cerrar</span>
        </div>
      </div>
    </div>
  );
}

function AnonTab({ setLastResult }) {
  const [inputText, setInputText] = useState('');
  const [result, setResult] = useState(null);
  const [cats, setCats] = useState(CATS.map(c => Object.assign({}, c)));
  const [customTerms, setCustomTerms] = useState('');
  const [showOriginal, setShowOriginal] = useState(false);
  const [copied, setCopied] = useState(false);
  const [copiedTable, setCopiedTable] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [uploadMsg, setUploadMsg] = useState('');
  const [showTemplates, setShowTemplates] = useState(false);
  const outputRef = useRef(null);
  const fileInputRef = useRef(null);

  const loadTemplate = (template) => {
    if (inputText && !window.confirm('¿Reemplazar el texto actual con la plantilla "' + template.name + '"?')) return;
    setInputText(template.text);
    setResult(null);
    setShowTemplates(false);
    // Auto-activate relevant categories
    setCats(prev => prev.map(c => {
      if (c.alwaysOn) return c;
      const shouldActivate = template.cats.includes(c.id);
      return Object.assign({}, c, { on: shouldActivate });
    }));
  };

  const activeCats = cats.filter(c => c.on);
  const allCats = [...cats, CUSTOM_CAT];
  const hasCustomTerms = customTerms.trim().split('\n').some(t => t.trim().length >= 2);

  const loadSample = () => {
    if (inputText && !window.confirm('¿Reemplazar el texto actual con el ejemplo?')) return;
    setInputText(SAMPLE_TEXT);
    setResult(null);
  };

  const clear = () => {
    if (!window.confirm('¿Borrar el texto y el resultado? Esta acción no se puede deshacer.')) return;
    setInputText('');
    setResult(null);
  };

  const handleFile = async (file) => {
    if (!file) return;
    setUploading(true);
    setUploadMsg('Procesando archivo…');
    try {
      const text = await extractTextFromFile(file, msg => setUploadMsg(msg));
      if (!text.trim()) throw new Error('No se pudo extraer texto del archivo. ¿Está protegido con contraseña o es un PDF escaneado (solo imágenes)?');
      setInputText(text);
      setResult(null);
      setUploadMsg('');
    } catch (err) {
      setUploadMsg('');
      alert('Error al leer el archivo:\n' + err.message);
    } finally {
      setUploading(false);
    }
  };

  const anonymize = () => {
    if (!inputText.trim()) return;
    if (activeCats.length === 0 && !hasCustomTerms) {
      alert('Activa al menos una categoría o añade términos personalizados antes de anonimizar.');
      return;
    }
    const r = runAnonymize(inputText, activeCats, customTerms);
    setResult(r);
    if (setLastResult) setLastResult(r);
    setTimeout(() => outputRef.current && outputRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  };

  const toggleCat = (id) => {
    const cat = CATS.find(c => c.id === id);
    if (cat && cat.alwaysOn) return;
    setCats(prev => prev.map(c => c.id === id ? Object.assign({}, c, { on: !c.on }) : c));
    setResult(null);
  };

  const copyOutput = () => {
    if (!result) return;
    navigator.clipboard.writeText(result.out).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
  };

  const copyTable = () => {
    if (!result || !result.reps.length) return;
    const lines = result.reps.map(r => r.replacement + '\t' + r.original + (r.hint ? '\t(' + r.hint + ')' : '') + '\t' + r.catLabel);
    navigator.clipboard.writeText(['Etiqueta\tOriginal\tHint\tCategoría'].concat(lines).join('\n')).then(() => {
      setCopiedTable(true); setTimeout(() => setCopiedTable(false), 2000);
    });
  };

  const downloadDocs = () => {
    if (!result) return;
    const { score } = computeResidualRisk(result.out);
    const riskInfo = getRiskInfo(score);
    const effectiveActiveCats = [...activeCats, ...(hasCustomTerms ? [CUSTOM_CAT] : [])];
    downloadCombinedDoc({
      anonText: result.out,
      reps: result.reps,
      cats: allCats,
      activeCats: effectiveActiveCats,
      riskScore: score,
      riskLabel: riskInfo.label,
      timestamp: new Date().toLocaleString('es'),
      originalLen: inputText.length,
    });
  };

  const riskData = result ? computeResidualRisk(result.out) : null;
  const canExport = result && riskData && riskData.score < 60;
  const totalDetected = result ? result.reps.length : 0;
  const byCategory = result
    ? allCats.map(c => Object.assign({}, c, { count: result.reps.filter(r => r.catId === c.id).length })).filter(c => c.count > 0)
    : [];

  return (
    <div className="space-y-6">
      {/* Panel de plantillas */}
      {showTemplates ? (
        <TemplatesPanel onSelect={loadTemplate} onClose={() => setShowTemplates(false)} />
      ) : null}

      {/* Categorías */}
      <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6">
        <div className="mb-4 flex items-center gap-2">
          <h3 className="font-bold text-[#222222]">Categorías de detección</h3>
          <InfoIcon text="Las categorías en rojo siempre están activas. Las demás se activan o desactivan. Las marcadas con (heurístico) tienen mayor riesgo de falsos positivos." />
        </div>
        <div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
          {cats.map(c => (
            <button
              key={c.id}
              onClick={() => toggleCat(c.id)}
              aria-pressed={c.on}
              disabled={c.alwaysOn}
              className={cn(
                "flex items-center gap-2 rounded-2xl border px-3 py-2.5 text-sm font-semibold transition text-left",
                c.alwaysOn
                  ? "border-[#fecaca] bg-[#fef2f2] text-[#dc2626] cursor-default"
                  : c.on
                    ? "border-[#b00020] bg-[#fff5f6] text-[#b00020]"
                    : "border-[#e5e5e5] bg-white text-[#757575] hover:bg-[#fafafa]"
              )}
            >
              {c.alwaysOn
                ? <span className="text-xs">🔒</span>
                : <span className={cn("h-2 w-2 shrink-0 rounded-full", c.on ? "bg-[#b00020]" : "bg-[#e5e5e5]")} />
              }
              <span className="truncate">{c.label}</span>
            </button>
          ))}
        </div>
        {/* Términos personalizados */}
        <div className="mt-5 pt-5 border-t border-[#e5e5e5]">
          <div className="mb-2 flex items-center gap-2">
            <span className="text-sm font-semibold text-[#222222]">Términos personalizados</span>
            <InfoIcon text="Escribe aquí nombres propios, siglas internas, códigos de proyecto, o cualquier término que quieras anonimizar y que no cubre ninguna categoría. Un término por línea. Se detectan sin distinción de mayúsculas y se reemplazan por [PERSONALIZADO_N]." />
          </div>
          <textarea
            className="w-full rounded-2xl border border-[#e5e5e5] bg-white p-3 font-mono text-sm text-[#222222] outline-none transition resize-y"
            onFocus={e => e.target.style.borderColor = '#b00020'}
            onBlur={e => e.target.style.borderColor = '#e5e5e5'}
            rows={15}
            value={customTerms}
            onChange={e => { setCustomTerms(e.target.value); setResult(null); }}
            placeholder={"Juan Pérez García\nProyecto Orión\nContrato-2024-XZ\n(un término por línea)"}
            aria-label="Términos personalizados para anonimizar"
          />
          <p className="mt-1.5 text-xs text-[#757575]">Un término por línea · Detección sin distinción de mayúsculas · Mínimo 2 caracteres por término</p>
        </div>
      </div>

      {/* Entrada */}
      <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6">
        <div className="mb-3 flex items-center justify-between gap-4 flex-wrap">
          <div className="flex items-center gap-2">
            <h3 className="font-bold text-[#222222]">Texto a anonimizar</h3>
            <InfoIcon text="Pega aquí emails, contratos, informes o cualquier documento. O sube un archivo .txt / .csv." />
          </div>
          <div className="flex gap-2 flex-wrap">
            <AppButton variant="secondary" disabled={uploading} onClick={() => fileInputRef.current && fileInputRef.current.click()}>
              {uploading ? '⏳ Procesando…' : '↑ PDF / DOCX / TXT / CSV'}
            </AppButton>
            <input
              ref={fileInputRef}
              type="file"
              accept=".txt,.csv,.pdf,.doc,.docx"
              className="hidden"
              onChange={e => { handleFile(e.target.files && e.target.files[0]); e.target.value = ''; }}
            />
            <AppButton variant="secondary" onClick={() => setShowTemplates(true)} disabled={uploading}>
              📋 Ver plantillas
            </AppButton>
            {inputText ? <AppButton variant="secondary" onClick={clear} disabled={uploading}>Limpiar</AppButton> : null}
          </div>
        </div>
        <textarea
          className="w-full rounded-2xl border border-[#e5e5e5] bg-white p-4 font-mono text-sm text-[#222222] outline-none transition resize-y"
          style={{ focusBorderColor: '#b00020' }}
          onFocus={e => e.target.style.borderColor = '#b00020'}
          onBlur={e => e.target.style.borderColor = '#e5e5e5'}
          rows={24}
          value={inputText}
          onChange={e => { setInputText(e.target.value); setResult(null); }}
          placeholder="Pega aquí el texto que deseas anonimizar antes de enviarlo a un modelo de IA…"
          aria-label="Texto de entrada para anonimizar"
        />
        {uploading && uploadMsg ? (
          <div className="mt-3 flex items-center gap-3 rounded-2xl border border-[#bfdbfe] bg-[#eff6ff] px-4 py-3 text-sm text-[#1d4ed8]">
            <span className="animate-spin text-lg">⏳</span>
            <span>{uploadMsg}</span>
          </div>
        ) : null}
        <div className="mt-3 flex items-center justify-between flex-wrap gap-2">
          <span className="text-xs text-[#757575]">{inputText.length.toLocaleString()} caracteres · {activeCats.length} categorías activas</span>
          <AppButton onClick={anonymize} disabled={!inputText.trim() || activeCats.length === 0 || uploading}>
            🔒 Anonimizar
          </AppButton>
        </div>
      </div>

      {/* Resultado */}
      {result ? (
        <div ref={outputRef} className="space-y-4">
          {/* Semáforo */}
          <RiskSemaphore text={result.out} activeCatIds={activeCats.map(c => c.id)} />

          {/* Bloqueo si riesgo alto */}
          {riskData && riskData.score >= 60 ? (
            <div className="rounded-2xl border border-[#fecaca] bg-[#fef2f2] p-4 text-sm text-[#dc2626] font-semibold">
              🔴 Exportación deshabilitada — riesgo residual demasiado alto ({riskData.score}%). Activa las categorías marcadas por el semáforo y vuelve a anonimizar.
            </div>
          ) : null}

          {/* Resumen */}
          <div className="grid gap-3 sm:grid-cols-3">
            {[
              { val: totalDetected, label: 'datos detectados', highlight: true },
              { val: byCategory.length, label: 'categorías con coincidencias' },
              { val: result.out.length.toLocaleString(), label: 'caracteres en resultado' },
            ].map((item, i) => (
              <div key={i} className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-4 text-center">
                <div className={cn("text-3xl font-bold", item.highlight ? "text-[#b00020]" : "text-[#222222]")}>{item.val}</div>
                <div className="text-xs text-[#757575] mt-1">{item.label}</div>
              </div>
            ))}
          </div>

          {/* Badges por categoría */}
          {byCategory.length > 0 ? (
            <div className="flex flex-wrap gap-2">
              {byCategory.map(c => (
                <span key={c.id} className="inline-flex items-center gap-1.5 rounded-full border px-3 py-1 text-xs font-semibold"
                  style={{ backgroundColor: c.bg, color: c.color, borderColor: c.border }}>
                  {c.label}: {c.count}
                </span>
              ))}
            </div>
          ) : null}

          {/* Texto anonimizado */}
          <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6">
            <div className="mb-3 flex items-center justify-between flex-wrap gap-2">
              <div className="flex items-center gap-3">
                <h3 className="font-bold text-[#222222]">Texto anonimizado</h3>
                <button
                  onClick={() => setShowOriginal(v => !v)}
                  className={cn("rounded-xl border px-3 py-1.5 text-xs font-semibold transition",
                    showOriginal ? "border-[#b00020] bg-[#fff5f6] text-[#b00020]" : "border-[#e5e5e5] bg-white text-[#757575] hover:bg-[#fafafa]")}
                >
                  {showOriginal ? '▼ Ocultar original' : '▶ Ver comparativa'}
                </button>
              </div>
              <div className="flex gap-2 flex-wrap">
                <AppButton variant="secondary" onClick={copyOutput} disabled={!canExport}>
                  {copied ? '✓ Copiado' : '📋 Copiar texto'}
                </AppButton>
                <AppButton onClick={downloadDocs} disabled={!canExport}>
                  ↓ Descargar .doc
                </AppButton>
              </div>
            </div>

            {/* Vista comparativa */}
            {showOriginal ? (
              <div className="grid gap-4 md:grid-cols-2 mb-4">
                <div>
                  <div className="mb-2 text-xs font-semibold text-[#757575]">ORIGINAL</div>
                  <div className="rounded-2xl border border-[#e5e5e5] bg-[#fafafa] p-4 overflow-x-auto max-h-80 overflow-y-auto">
                    <pre className="whitespace-pre-wrap break-words font-mono text-sm leading-relaxed text-[#757575]">{inputText}</pre>
                  </div>
                </div>
                <div>
                  <div className="mb-2 text-xs font-semibold text-[#b00020]">ANONIMIZADO</div>
                  <div className="rounded-2xl border border-[#e5e5e5] bg-[#fafafa] p-4 overflow-x-auto max-h-80 overflow-y-auto">
                    <HighlightedOutput text={result.out} reps={result.reps} cats={allCats} />
                  </div>
                </div>
              </div>
            ) : (
              <div className="rounded-2xl border border-[#e5e5e5] bg-[#fafafa] p-4 overflow-x-auto">
                <HighlightedOutput text={result.out} reps={result.reps} cats={allCats} />
              </div>
            )}

            <p className="mt-2 text-xs text-[#757575]">
              Pasa el cursor sobre las etiquetas para ver el valor original.
              {riskData && riskData.score >= 60 ? ' La exportación está deshabilitada por alto riesgo residual.' : ''}
            </p>
          </div>

          {/* Tabla de equivalencias */}
          {result.reps.length > 0 ? (
            <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6">
              <div className="mb-3 flex items-center justify-between flex-wrap gap-2">
                <div className="flex items-center gap-2">
                  <h3 className="font-bold text-[#222222]">Tabla de equivalencias</h3>
                  <InfoIcon text="Esta tabla mapea [ETIQUETA] → dato original. Se incluye automáticamente en el segundo .doc al descargar. Al cerrar la pestaña, desaparece." />
                </div>
                <div className="flex gap-2">
                  <AppButton variant="secondary" onClick={copyTable}>
                    {copiedTable ? '✓ Copiada' : '📋 Copiar'}
                  </AppButton>
                  <AppButton variant="secondary" onClick={downloadDocs} disabled={!canExport}>
                    ↓ Descargar .doc
                  </AppButton>
                </div>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="border-b border-[#e5e5e5]">
                      <th className="py-2 pr-4 text-left font-semibold text-[#222222]">Etiqueta</th>
                      <th className="py-2 pr-4 text-left font-semibold text-[#222222]">Dato original</th>
                      <th className="py-2 pr-4 text-left font-semibold text-[#222222]">Rango / Hint</th>
                      <th className="py-2 text-left font-semibold text-[#222222]">Categoría</th>
                    </tr>
                  </thead>
                  <tbody>
                    {result.reps.map((r, i) => {
                      const cat = allCats.find(c => c.id === r.catId);
                      return (
                        <tr key={i} className="border-b border-[#e5e5e5] last:border-0">
                          <td className="py-2 pr-4">
                            <mark className="anon font-mono text-xs px-1.5 py-0.5 rounded"
                              style={{ backgroundColor: cat ? cat.bg : '#f5f5f5', color: cat ? cat.color : '#333', border: '1px solid ' + (cat ? cat.border : '#e5e5e5') }}>
                              {r.replacement}
                            </mark>
                          </td>
                          <td className="py-2 pr-4 font-mono text-xs text-[#333333] break-all">{r.original}</td>
                          <td className="py-2 pr-4 text-xs text-[#757575]">{r.hint || '—'}</td>
                          <td className="py-2 text-xs text-[#757575]">{r.catLabel}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          ) : null}
        </div>
      ) : null}

      {/* Estado vacío */}
      {!result && !inputText ? (
        <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-10 text-center">
          <div className="text-4xl mb-3">🔒</div>
          <p className="text-lg font-semibold text-[#222222] mb-1">Tu texto anonimizado aparecerá aquí</p>
          <p className="text-sm text-[#757575] mb-4">Pega texto directamente o elige una plantilla de 50 tipos de documentos reales.</p>
          <AppButton variant="secondary" onClick={() => setShowTemplates(true)}>📋 Ver plantillas de ejemplo</AppButton>
        </div>
      ) : null}
    </div>
  );
}

// ─── Pestaña Documento ────────────────────────────────────────────────────────
function DocumentTab() {
  const [cats, setCats] = useState(CATS.map(c => Object.assign({}, c)));
  const [customTerms, setCustomTerms] = useState('');
  const [uploading, setUploading] = useState(false);
  const [uploadMsg, setUploadMsg] = useState('');
  const [uploadedFile, setUploadedFile] = useState(null);
  const [viewerOpen, setViewerOpen] = useState(false);
  const [viewerData, setViewerData] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const fileInputRef = useRef(null);

  const activeCats = cats.filter(c => c.on);
  const allCats = [...cats, CUSTOM_CAT];
  const hasCustomTerms = customTerms.trim().split('\n').some(t => t.trim().length >= 2);

  const toggleCat = (id) => {
    const cat = CATS.find(c => c.id === id);
    if (cat && cat.alwaysOn) return;
    setCats(prev => prev.map(c => c.id === id ? Object.assign({}, c, { on: !c.on }) : c));
  };

  const processFile = async (file) => {
    if (!file) return;
    setUploading(true);
    setUploadMsg('Procesando archivo…');
    setUploadedFile(null);
    try {
      const text = await extractTextFromFile(file, msg => setUploadMsg(msg));
      if (!text.trim()) throw new Error('No se pudo extraer texto. ¿Es un PDF escaneado o está protegido con contraseña?');
      setUploadedFile({ name: file.name, text });
      setUploadMsg('');
    } catch (err) {
      setUploadMsg('');
      alert('Error al leer el archivo:\n' + err.message);
    } finally {
      setUploading(false);
    }
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) processFile(file);
  };

  const anonymizeAndOpen = () => {
    if (!uploadedFile) return;
    if (activeCats.length === 0 && !hasCustomTerms) return;
    const r = runAnonymize(uploadedFile.text, activeCats, customTerms);
    const effectiveActiveCats = [...activeCats, ...(hasCustomTerms ? [CUSTOM_CAT] : [])];
    setViewerData({
      anonText: r.out,
      reps: r.reps,
      cats: allCats,
      activeCats: effectiveActiveCats,
      fileName: uploadedFile.name,
      originalLen: uploadedFile.text.length,
    });
    setViewerOpen(true);
  };

  return (
    <div className="space-y-6">
      {/* Zona de carga */}
      <div
        className={cn(
          'rounded-[28px] border-2 border-dashed transition-all cursor-pointer select-none',
          dragOver ? 'border-[#b00020] bg-[#fff5f6]' : 'border-[#e5e5e5] bg-white hover:border-[#b00020]/40 hover:bg-[#fff5f6]/50'
        )}
        onClick={() => !uploading && fileInputRef.current && fileInputRef.current.click()}
        onDragOver={e => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={handleDrop}
        role="button"
        aria-label="Zona de carga de documentos"
      >
        <div className="flex flex-col items-center justify-center gap-3 py-12">
          <span className="text-5xl">{uploading ? '⏳' : uploadedFile ? '📄' : '📂'}</span>
          {uploading ? (
            <div className="text-center">
              <p className="font-semibold text-[#222222]">Procesando documento…</p>
              <p className="mt-1 text-sm text-[#757575]">{uploadMsg}</p>
            </div>
          ) : uploadedFile ? (
            <div className="text-center">
              <p className="font-semibold text-[#222222]">{uploadedFile.name}</p>
              <p className="mt-1 text-sm text-[#757575]">{uploadedFile.text.length.toLocaleString()} caracteres extraídos · Haz clic para cambiar el archivo</p>
            </div>
          ) : (
            <div className="text-center">
              <p className="font-semibold text-[#222222]">Arrastra tu documento aquí o haz clic para seleccionarlo</p>
              <p className="mt-1 text-sm text-[#757575]">PDF, DOCX, DOC, TXT, CSV · Procesamiento 100% local</p>
              <p className="mt-0.5 text-xs text-[#aaaaaa]">Hasta {MAX_FILE_MB} MB y {MAX_PDF_PAGES} páginas · documentos de varias páginas admitidos</p>
            </div>
          )}
        </div>
      </div>
      <input ref={fileInputRef} type="file" accept=".txt,.csv,.pdf,.doc,.docx" className="hidden"
        onChange={e => { processFile(e.target.files && e.target.files[0]); e.target.value = ''; }} />

      {/* Categorías */}
      <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6">
        <div className="mb-4 flex items-center gap-2">
          <h3 className="font-bold text-[#222222]">Categorías de detección</h3>
          <InfoIcon text="Las credenciales siempre están activas. Activa las demás según tu caso de uso." />
        </div>
        <div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
          {cats.map(c => (
            <button key={c.id} onClick={() => toggleCat(c.id)} aria-pressed={c.on} disabled={c.alwaysOn}
              className={cn('flex items-center gap-2 rounded-2xl border px-3 py-2.5 text-sm font-semibold transition text-left',
                c.alwaysOn ? 'border-[#fecaca] bg-[#fef2f2] text-[#dc2626] cursor-default'
                  : c.on ? 'border-[#b00020] bg-[#fff5f6] text-[#b00020]'
                  : 'border-[#e5e5e5] bg-white text-[#757575] hover:bg-[#fafafa]')}>
              {c.alwaysOn ? <span className="text-xs">🔒</span> : <span className={cn('h-2 w-2 shrink-0 rounded-full', c.on ? 'bg-[#b00020]' : 'bg-[#e5e5e5]')} />}
              <span className="truncate">{c.label}</span>
            </button>
          ))}
        </div>
        {/* Términos personalizados */}
        <div className="mt-5 pt-5 border-t border-[#e5e5e5]">
          <div className="mb-2 flex items-center gap-2">
            <span className="text-sm font-semibold text-[#222222]">Términos personalizados</span>
            <InfoIcon text="Escribe aquí nombres propios, siglas internas, códigos de proyecto, o cualquier término que quieras anonimizar y que no cubre ninguna categoría. Un término por línea. Se detectan sin distinción de mayúsculas y se reemplazan por [PERSONALIZADO_N]." />
          </div>
          <textarea
            className="w-full rounded-2xl border border-[#e5e5e5] bg-white p-3 font-mono text-sm text-[#222222] outline-none transition resize-y"
            onFocus={e => e.target.style.borderColor = '#b00020'}
            onBlur={e => e.target.style.borderColor = '#e5e5e5'}
            rows={15}
            value={customTerms}
            onChange={e => setCustomTerms(e.target.value)}
            placeholder={"Juan Pérez García\nProyecto Orión\nContrato-2024-XZ\n(un término por línea)"}
            aria-label="Términos personalizados para anonimizar"
          />
          <p className="mt-1.5 text-xs text-[#757575]">Un término por línea · Detección sin distinción de mayúsculas · Mínimo 2 caracteres por término</p>
        </div>
      </div>

      {/* Botón anonimizar */}
      <div className="flex items-center justify-between gap-4">
        <p className="text-sm text-[#757575]">El documento anonimizado se mostrará en un visor antes de descargar o imprimir.</p>
        <AppButton onClick={anonymizeAndOpen} disabled={!uploadedFile || (activeCats.length === 0 && !hasCustomTerms) || uploading}>
          🔒 Anonimizar y ver
        </AppButton>
      </div>

      {/* Visor */}
      {viewerOpen && viewerData ? (
        <DocumentViewer
          open={viewerOpen}
          onClose={() => setViewerOpen(false)}
          anonText={viewerData.anonText}
          reps={viewerData.reps}
          cats={viewerData.cats}
          activeCats={viewerData.activeCats}
          fileName={viewerData.fileName}
          originalLen={viewerData.originalLen}
        />
      ) : null}
    </div>
  );
}

// ─── Pestaña Recuperar ────────────────────────────────────────────────────────
function RecoverTab({ lastResult }) {
  const [mode, setMode] = useState(lastResult ? 'auto' : 'paste');
  const [mappingText, setMappingText] = useState('');
  const [modifiedText, setModifiedText] = useState('');
  const [recovered, setRecovered] = useState(null);
  const [copiedRecover, setCopiedRecover] = useState(false);

  const buildMapping = () => {
    if (mode === 'auto' && lastResult && lastResult.reps) {
      const map = {};
      for (const r of lastResult.reps) map[r.replacement] = r.original;
      return map;
    } else if (mode === 'paste' && mappingText.trim()) {
      const map = {};
      const lines = mappingText.trim().split('\n');
      for (const line of lines) {
        const parts = line.split('\t');
        if (parts.length >= 2) {
          const tag = parts[0].trim();
          const original = parts[1].trim();
          if (/^\[[A-Z_]+_\d+\]$/.test(tag)) map[tag] = original;
        }
      }
      return map;
    }
    return {};
  };

  const recover = () => {
    if (!modifiedText.trim()) { alert('Pega el texto modificado por el LLM.'); return; }
    const mapping = buildMapping();
    if (!Object.keys(mapping).length) {
      alert('No hay mapeo disponible. Cambia a "Pegar tabla" y pega la tabla de equivalencias.');
      return;
    }
    const tagPattern = /\[[A-Z_]+_\d+\]/g;
    const found = [...new Set(modifiedText.match(tagPattern) || [])];
    const resolved = [];
    const unresolved = [];
    let out = modifiedText;
    for (const tag of found) {
      if (mapping[tag] !== undefined) {
        out = out.split(tag).join(mapping[tag]);
        resolved.push({ tag, value: mapping[tag] });
      } else {
        unresolved.push(tag);
      }
    }
    setRecovered({ out, resolved, unresolved });
  };

  const copyRecovered = () => {
    if (!recovered) return;
    navigator.clipboard.writeText(recovered.out).then(() => {
      setCopiedRecover(true);
      setTimeout(() => setCopiedRecover(false), 2000);
    });
  };

  const hasMappingSource = (mode === 'auto' && lastResult) || (mode === 'paste' && mappingText.trim());

  return (
    <div className="space-y-6">
      <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6">
        <h2 className="text-xl font-bold text-[#222222] mb-1">Recuperar texto original</h2>
        <p className="text-sm text-[#757575]">
          Devuelve el texto a su forma original después de que el LLM lo procesó, reemplazando cada etiqueta <span className="font-mono">[TAG_N]</span> por el dato real correspondiente.
        </p>
      </div>

      <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6">
        <p className="text-xs font-semibold uppercase tracking-wide text-[#757575] mb-3">Fuente del mapeo</p>
        <div className="mb-4 flex gap-3">
          <button
            onClick={() => { setMode('auto'); setRecovered(null); }}
            className={cn("flex-1 rounded-2xl border px-4 py-3 text-sm font-semibold transition text-left",
              mode === 'auto'
                ? "border-[#b00020] bg-[#fff5f6] text-[#b00020]"
                : "border-[#e5e5e5] text-[#333333] hover:bg-[#fafafa]"
            )}
          >
            <div className="font-bold mb-0.5">⚡ Sesión actual</div>
            <div className={cn("text-xs font-normal", mode === 'auto' ? 'text-[#b00020]' : 'text-[#757575]')}>
              {lastResult
                ? lastResult.reps.length + ' etiquetas disponibles de la última anonimización'
                : 'Anonimiza primero en la pestaña Texto'}
            </div>
          </button>
          <button
            onClick={() => { setMode('paste'); setRecovered(null); }}
            className={cn("flex-1 rounded-2xl border px-4 py-3 text-sm font-semibold transition text-left",
              mode === 'paste'
                ? "border-[#b00020] bg-[#fff5f6] text-[#b00020]"
                : "border-[#e5e5e5] text-[#333333] hover:bg-[#fafafa]"
            )}
          >
            <div className="font-bold mb-0.5">📋 Pegar tabla</div>
            <div className={cn("text-xs font-normal", mode === 'paste' ? 'text-[#b00020]' : 'text-[#757575]')}>
              Sesiones distintas: copia la tabla del .doc descargado y pégala aquí
            </div>
          </button>
        </div>

        {mode === 'paste' && (
          <div>
            <div className="mb-2 flex items-center gap-2">
              <span className="text-sm font-semibold text-[#222222]">Tabla de equivalencias</span>
              <InfoIcon text="En Word: selecciona toda la tabla de equivalencias → Copiar → pega aquí. También funciona con el botón '📋 Copiar' de la tabla en la pestaña Texto." />
            </div>
            <textarea
              rows={10}
              value={mappingText}
              onChange={e => { setMappingText(e.target.value); setRecovered(null); }}
              className="w-full rounded-2xl border border-[#e5e5e5] bg-[#fafafa] p-3 font-mono text-xs text-[#333333] focus:outline-none focus:ring-2 focus:ring-[#b00020]/30 resize-y"
              placeholder={"Etiqueta\tDato original\tRango / Hint\tCategoría\n[EMAIL_1]\tmaria@empresa.com\t—\tCorreos electrónicos\n[TELEFONO_1]\t+52 55 4321 0987\t—\tTeléfonos"}
            />
            <p className="mt-1.5 text-xs text-[#757575]">
              En Word: selecciona la tabla → Copiar → pega aquí · O usa "📋 Copiar" de la tabla en la pestaña Texto
            </p>
          </div>
        )}
      </div>

      <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6">
        <div className="mb-2 flex items-center gap-2">
          <span className="text-sm font-semibold text-[#222222]">Texto modificado por el LLM</span>
          <InfoIcon text="Pega aquí el texto que te devolvió ChatGPT, Claude u otro modelo. Las etiquetas [TAG_N] serán reemplazadas por los datos originales." />
        </div>
        <textarea
          rows={18}
          value={modifiedText}
          onChange={e => { setModifiedText(e.target.value); setRecovered(null); }}
          className="w-full rounded-2xl border border-[#e5e5e5] bg-[#fafafa] p-3 text-sm text-[#333333] focus:outline-none focus:ring-2 focus:ring-[#b00020]/30 resize-y"
          placeholder="Pega aquí el texto que te devolvió el LLM. Las etiquetas [EMAIL_1], [TELEFONO_1], etc. serán reemplazadas por los datos originales."
        />
        <div className="mt-3">
          <AppButton onClick={recover} disabled={!modifiedText.trim() || !hasMappingSource}>
            🔄 Recuperar texto original
          </AppButton>
        </div>
      </div>

      {recovered ? (
        <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6 space-y-4">
          <div className="flex items-center gap-3 flex-wrap">
            {recovered.resolved.length > 0 && (
              <span className="inline-flex items-center gap-1.5 rounded-xl bg-[#f0fdf4] border border-[#bbf7d0] px-3 py-1.5 text-sm font-semibold text-[#16a34a]">
                ✓ {recovered.resolved.length} etiqueta{recovered.resolved.length !== 1 ? 's' : ''} restaurada{recovered.resolved.length !== 1 ? 's' : ''}
              </span>
            )}
            {recovered.unresolved.length > 0 && (
              <span className="inline-flex items-center gap-1.5 rounded-xl bg-[#fffbeb] border border-[#fcd34d] px-3 py-1.5 text-sm font-semibold text-[#d97706]">
                ⚠ {recovered.unresolved.length} sin resolver
              </span>
            )}
            {recovered.resolved.length === 0 && recovered.unresolved.length === 0 && (
              <span className="text-sm text-[#757575]">No se encontraron etiquetas [TAG_N] en el texto.</span>
            )}
          </div>

          <div>
            <div className="mb-2 flex items-center justify-between">
              <span className="text-sm font-semibold text-[#222222]">Texto recuperado</span>
              <AppButton variant="secondary" onClick={copyRecovered}>
                {copiedRecover ? '✓ Copiado' : '📋 Copiar'}
              </AppButton>
            </div>
            <div className="rounded-2xl border border-[#e5e5e5] bg-[#fafafa] p-4 max-h-96 overflow-y-auto">
              <pre className="whitespace-pre-wrap break-words text-sm leading-relaxed text-[#222222]">{recovered.out}</pre>
            </div>
          </div>

          {recovered.unresolved.length > 0 && (
            <div className="rounded-2xl border border-[#fcd34d] bg-[#fffbeb] p-4 text-sm text-[#92400e]">
              <strong>Etiquetas sin resolver:</strong> {recovered.unresolved.join(', ')}
              <span className="block mt-1 text-xs">
                Estas etiquetas no estaban en la tabla de equivalencias. Puede que correspondan a otra anonimización o que la tabla esté incompleta.
              </span>
            </div>
          )}
        </div>
      ) : null}
    </div>
  );
}

// ─── App principal ────────────────────────────────────────────────────────────
const TABS = [
  { id: 'how', label: 'Cómo usar' },
  { id: 'texto', label: 'Texto' },
  { id: 'doc', label: 'Documento' },
  { id: 'recover', label: '🔄 Recuperar' },
  { id: 'privacy', label: 'Privacidad' },
];

function App() {
  const [tab, setTab] = useState('how');
  const [aboutOpen, setAboutOpen] = useState(false);
  const [lastResult, setLastResult] = useState(null);

  return (
    <div className="min-h-screen bg-white">
      <header className="sticky top-0 z-40 border-b border-[#e5e5e5] bg-white/95 backdrop-blur">
        <div className="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-4">
          <div className="flex items-center gap-3">
            <div className="flex h-10 w-10 items-center justify-center rounded-2xl bg-[#b00020] text-lg font-bold text-white select-none">F</div>
            <div>
              <div className="flex items-center gap-2">
                <span className="text-lg font-bold tracking-tight text-[#222222]">FuturIA</span>
                <span className="text-sm font-semibold text-[#757575]">Anonimizador IA</span>
              </div>
              <p className="text-xs text-[#757575]">Protege datos sensibles antes de usar modelos de IA — 100% local</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <AppButton variant="secondary" onClick={() => setAboutOpen(true)}>Acerca de</AppButton>
            <a href="https://futuria.substack.com/" target="_blank" rel="noreferrer">
              <AppButton>Únete a FuturIA →</AppButton>
            </a>
          </div>
        </div>
      </header>

      <nav className="sticky top-[72px] z-30 border-b border-[#e5e5e5] bg-white/95 backdrop-blur">
        <div className="mx-auto flex max-w-7xl items-center gap-1 overflow-x-auto px-5 py-2">
          {TABS.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              aria-current={tab === t.id ? 'page' : undefined}
              className={cn("shrink-0 rounded-xl px-4 py-2 text-sm font-semibold transition",
                tab === t.id
                  ? "bg-[#fff5f6] text-[#b00020] border border-[#b00020]"
                  : "text-[#333333] hover:bg-[#fff5f6]")}>
              {t.label}
            </button>
          ))}
        </div>
      </nav>

      <main className="mx-auto max-w-7xl px-5 py-8">
        {tab === 'how' ? <HowToTab /> : null}
        {tab === 'texto' ? <AnonTab setLastResult={setLastResult} /> : null}
        {tab === 'doc' ? <DocumentTab /> : null}
        {tab === 'recover' ? <RecoverTab lastResult={lastResult} /> : null}
        {tab === 'privacy' ? <PrivacyTab /> : null}
      </main>

      <footer className="border-t border-[#e5e5e5] py-6 text-center text-xs text-[#757575]">
        FuturIA Anonimizador IA — Procesamiento 100% local. Sin servidores. Sin almacenamiento.
        {' · '}
        <a href="https://futuria.substack.com/" target="_blank" rel="noreferrer" className="text-[#b00020] hover:underline">futuria.substack.com</a>
      </footer>

      <AboutModal open={aboutOpen} onClose={() => setAboutOpen(false)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
