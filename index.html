function WorkTab({ setLastResult, lastResult, initialMode }) {
  const dialogs = useDialog();
  const [inputText, setInputText] = useState('');
  const [sourceName, setSourceName] = useState(null);
  const [result, setResult] = useState(null);
  const [reviewed, setReviewed] = useState(false);
  React.useEffect(() => { setReviewed(false); }, [result]);
  const [cats, setCats] = useState(CATS.map(c => Object.assign({}, c)));
  const [customTerms, setCustomTerms] = useState('');
  const [whitelist, setWhitelist] = useState('');
  const [showOriginal, setShowOriginal] = useState(false);
  const [copied, setCopied] = useState(false);
  const [copiedTable, setCopiedTable] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [uploadMsg, setUploadMsg] = useState('');
  const [status, setStatus] = useState('');
  const [showTemplates, setShowTemplates] = useState(false);
  const [viewerOpen, setViewerOpen] = useState(false);
  const [viewerData, setViewerData] = useState(null);
  const [keySaved, setKeySaved] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const viewerGeneration = useRef(0);
  const outputRef = useRef(null);
  const fileInputRef = useRef(null);
  const announce = message => { setStatus(''); setTimeout(() => setStatus(message), 30); };

  const activeCats = cats.filter(c => c.on);
  const activeIds = activeCats.map(c => c.id);
  const allCats = [...cats, CUSTOM_CAT];
  const hasCustomTerms = customTerms.trim().split('\n').some(t => t.trim().length >= 2);

  // Aviso antes de perder la llave de recuperación en memoria.
  React.useEffect(() => {
    if (!result || keySaved) return;
    const handler = e => { e.preventDefault(); e.returnValue = ''; };
    window.addEventListener('beforeunload', handler);
    return () => window.removeEventListener('beforeunload', handler);
  }, [result, keySaved]);

  const invalidate = () => { setResult(null); setKeySaved(false); };

  const loadTemplate = async (template) => {
    if (inputText && !(await dialogs.confirm('¿Reemplazar el texto actual con la plantilla «' + template.name + '»?', { ok: 'Reemplazar' }))) return;
    setInputText(template.text); setSourceName(null); invalidate(); setShowTemplates(false);
    setCats(prev => prev.map(c => c.alwaysOn ? c : Object.assign({}, c, { on: c.id === 'person' || c.id === 'birthdate' || template.cats.includes(c.id) })));
    announce('Plantilla cargada: ' + template.name);
  };

  const trySample = () => {
    setInputText(SAMPLE_TEXT); setSourceName(null);
    const r = runAnonymize(SAMPLE_TEXT, activeCats, customTerms, { whitelist });
    setResult(r); setKeySaved(false); if (setLastResult) setLastResult(r);
    announce('Ejemplo procesado: ' + r.reps.length + ' datos sustituidos.');
    setTimeout(() => outputRef.current && outputRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  };

  const clear = async () => {
    if (!(await dialogs.confirm('¿Borrar el texto y el resultado? Si no guardaste la llave de recuperación, no podrás recuperar los originales.', { ok: 'Borrar', danger: true }))) return;
    setInputText(''); setSourceName(null); invalidate(); setCustomTerms(''); setLastResult(null); setViewerData(null);
    announce('Texto y resultado borrados.');
  };

  const handleFile = async (file) => {
    if (!file) return;
    setUploading(true); setUploadMsg('Procesando archivo…');
    try {
      const text = await extractTextFromFile(file, msg => { setUploadMsg(msg); });
      if (!text.trim()) throw new Error('No se pudo extraer texto del archivo. ¿Está protegido con contraseña o es un PDF escaneado (solo imágenes)?');
      setInputText(text); setSourceName(file.name); invalidate(); setUploadMsg('');
      announce('Archivo cargado: ' + file.name + ', ' + text.length.toLocaleString() + ' caracteres.');
    } catch (err) {
      setUploadMsg('');
      dialogs.alert(err.message, 'No se pudo leer el archivo');
    } finally { setUploading(false); }
  };

  const anonymize = () => {
    if (!inputText.trim()) return;
    if (activeCats.length === 0 && !hasCustomTerms) { dialogs.alert('Activa al menos una categoría o añade términos a ocultar antes de procesar.'); return; }
    const r = runAnonymize(inputText, activeCats, customTerms, { whitelist });
    setResult(r); setKeySaved(false);
    if (setLastResult) setLastResult(r);
    announce('Listo: ' + r.reps.length + ' datos sustituidos. Revisa el resultado antes de copiarlo.');
    setTimeout(() => outputRef.current && outputRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  };

  const toggleCat = (id) => {
    const cat = CATS.find(c => c.id === id);
    if (cat && cat.alwaysOn) return;
    setCats(prev => prev.map(c => c.id === id ? Object.assign({}, c, { on: !c.on }) : c));
    invalidate();
  };
  const applyPreset = (preset) => {
    setCats(prev => prev.map(c => c.alwaysOn ? c : Object.assign({}, c, { on: preset.cats.includes(c.id) })));
    invalidate(); announce('Ajuste aplicado: ' + preset.label);
  };
  const excludeFromResult = (rep) => {
    setWhitelist((whitelist.trim() ? whitelist.replace(/\s+$/, '') + '\n' : '') + rep.original);
    invalidate(); announce('«' + rep.original + '» añadido a la lista blanca. Vuelve a procesar.');
  };

  const riskData = useMemo(() => result ? computeResidualRisk(result.out, activeIds, { whitelist }) : null, [result, activeIds.join(','), whitelist]);
  const canExport = !!(result && riskData && riskData.hits.length === 0 && reviewed);

  const copyOutput = (withInstruction) => {
    if (!canExport) return;
    const instruction = withInstruction ? 'Instrucción: el texto siguiente contiene etiquetas entre corchetes como [PERSONA_1] o [EMAIL_2]. Consérvalas exactamente igual en tu respuesta; no las traduzcas, numeres ni expliques.\n\n' : '';
    copyLocalText(instruction + result.out, m => dialogs.alert(m)).then(ok => { if (ok) { setCopied(true); announce('Texto copiado al portapapeles.'); setTimeout(() => setCopied(false), 2000); } });
  };

  const copyTable = async () => {
    if (!result || !result.reps.length) return;
    const ok = await dialogs.confirm('Esta llave CONFIDENCIAL contiene los datos originales. El portapapeles puede conservarlos o sincronizarlos. No la pegues en un modelo de IA. ¿Quieres copiarla?', { ok: 'Copiar llave', danger: true });
    if (!ok) return;
    // La escritura ocurre tras cerrar el diálogo, dentro de la misma tarea de clic del botón del diálogo.
    copyLocalText(serializeEquivalences(result.reps), m => dialogs.alert(m)).then(done => { if (done) { setCopiedTable(true); setKeySaved(true); announce('Llave copiada.'); setTimeout(() => setCopiedTable(false), 2000); } });
  };

  const downloadKey = () => {
    if (!result || !result.reps.length) return;
    const stamp = new Date().toISOString().slice(0, 10);
    const base = (sourceName ? sourceName.replace(/\.[^.]+$/, '') : 'texto');
    const blob = new Blob(['\uFEFF' + serializeEquivalences(result.reps)], { type: 'text/tab-separated-values;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'LLAVE-CONFIDENCIAL-NO-SUBIR-A-IA_' + base + '_' + stamp + '.tsv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    setKeySaved(true); announce('Llave de recuperación descargada.');
  };

  const downloadDocs = () => {
    if (!canExport) return;
    const riskInfo = getRiskInfo(riskData.score);
    const effectiveActiveCats = [...activeCats, ...(hasCustomTerms ? [CUSTOM_CAT] : [])];
    downloadCombinedDoc({ anonText: result.out, reps: result.reps, cats: allCats, activeCats: effectiveActiveCats, riskScore: riskData.score, riskLabel: riskInfo.label, reviewed, timestamp: new Date().toLocaleString('es'), originalLen: inputText.length,
      confirm: m => dialogs.confirm(m, { ok: 'Descargar respaldo', danger: true }) }).then(done => { if (done) setKeySaved(true); });
  };

  const openViewer = () => {
    if (!result) return;
    const effectiveActiveCats = [...activeCats, ...(hasCustomTerms ? [CUSTOM_CAT] : [])];
    setViewerData({ generation: ++viewerGeneration.current, anonText: result.out, reps: result.reps, cats: allCats, activeCats: effectiveActiveCats, fileName: sourceName, originalLen: inputText.length });
    setViewerOpen(true);
  };

  const handleDrop = (e) => { e.preventDefault(); setDragOver(false); const file = e.dataTransfer.files && e.dataTransfer.files[0]; if (file) handleFile(file); };
  const totalDetected = result ? result.reps.length : 0;
  const byCategory = result ? allCats.map(c => Object.assign({}, c, { count: result.reps.filter(r => r.catId === c.id).reduce((s, r) => s + (r.count || 1), 0) })).filter(c => c.count > 0) : [];
  const fileAccept = ".txt,.csv,.pdf,.doc,.docx,text/plain,text/csv,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document";

  return (
    <div className="space-y-6">
      <LiveStatus message={status} />
      {showTemplates ? <TemplatesPanel onSelect={loadTemplate} onClose={() => setShowTemplates(false)} /> : null}

      {/* Bloque 1 — arranque: qué es esto y cómo probarlo sin arriesgar nada */}
      <section className="rounded-[28px] border border-[#e5e5e5] bg-[#fafafa] px-6 py-5" aria-labelledby="start-title">
        <div className="flex flex-wrap items-center justify-between gap-4">
          <div className="min-w-0 max-w-2xl">
            <h2 id="start-title" className="text-lg font-bold text-[#222222]">Pásalo por aquí antes de pegarlo en una IA</h2>
            <p className="mt-1 text-sm text-[#444444]">Cambiamos nombres, teléfonos, cuentas y claves por etiquetas. Luego los recuperas. Nada sale de tu navegador.</p>
            <p className="mt-1 text-xs text-[#6b6b6b]">Prueba primero con un ejemplo: son 50 textos con datos inventados.</p>
          </div>
          <div className="flex gap-2 flex-wrap">
            <AppButton variant="secondary" className="border-[#222222]" onClick={trySample}>Ver un ejemplo ahora</AppButton>
            <button type="button" onClick={() => setShowTemplates(true)} disabled={uploading} className="text-sm font-semibold text-[#333333] underline-offset-2 hover:underline disabled:text-[#8a8a8a]">Más ejemplos: contratos, nómina, ventas…</button>
          </div>
        </div>
      </section>

      {/* Bloque 2 — tu texto */}
      <section className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6" aria-labelledby="input-title"
        onDragOver={e => { e.preventDefault(); setDragOver(true); }} onDragLeave={() => setDragOver(false)} onDrop={handleDrop}>
        <div className="mb-3 flex items-center justify-between gap-4 flex-wrap">
          <h2 id="input-title" className="font-bold text-[#222222]"><span className="text-[#6b6b6b]">1 ·</span> Pega tu texto o sube un archivo</h2>
          <div className="flex items-center gap-2 flex-wrap">
            <AppButton variant="secondary" disabled={uploading} onClick={() => fileInputRef.current && fileInputRef.current.click()} aria-describedby="file-limits">
              {uploading ? '⏳ Procesando…' : '↑ Subir archivo'}
            </AppButton>
            <span id="file-limits" className="text-xs text-[#6b6b6b]">PDF, Word, TXT o CSV · hasta {MAX_FILE_MB} MB y {MAX_PDF_PAGES} páginas</span>
            <input ref={fileInputRef} type="file" accept={fileAccept} className="hidden" aria-label="Seleccionar archivo"
              onChange={e => { handleFile(e.target.files && e.target.files[0]); e.target.value = ''; }} />
            {inputText ? <AppButton variant="secondary" onClick={clear} disabled={uploading}>Limpiar</AppButton> : null}
          </div>
        </div>
        <textarea id="input-text"
          className={cn("w-full rounded-2xl border bg-white p-4 font-mono text-base sm:text-sm text-[#222222] outline-none transition resize-y focus:border-[#b00020] focus:ring-2 focus:ring-[#b00020]",
            dragOver ? 'border-[#b00020] bg-[#fff5f6]' : 'border-[#9a9a9a]')}
          rows={12} value={inputText}
          onChange={e => { setInputText(e.target.value); setSourceName(null); invalidate(); }}
          placeholder="Pega aquí lo que vas a enviar a ChatGPT, Claude o Gemini, o arrastra un archivo."
          aria-label="Texto a procesar" />
        {sourceName ? <p className="mt-2 text-xs text-[#6b6b6b]">Archivo: {sourceName} · puedes editar el texto extraído antes de continuar.</p> : null}
        {uploading && uploadMsg ? (
          <div className="mt-3 flex items-center gap-3 rounded-2xl border border-[#bfdbfe] bg-[#eff6ff] px-4 py-3 text-sm text-[#1d4ed8]" role="status">
            <span className="animate-spin text-lg" aria-hidden="true">⏳</span><span>{uploadMsg}</span>
          </div>
        ) : null}
        <div className="mt-3 flex items-center justify-between flex-wrap gap-2">
          <span className="text-xs text-[#6b6b6b]">{inputText.trim() ? inputText.length.toLocaleString() + ' caracteres' : ''}</span>
          <span className="flex items-center gap-3 flex-wrap">
            {!inputText.trim() ? <span className="text-xs text-[#6b6b6b]">Pega un texto o <button type="button" onClick={trySample} className="font-semibold text-[#222222] underline">ve un ejemplo</button> para activar el botón →</span> : null}
            <AppButton onClick={anonymize} disabled={!inputText.trim() || (activeCats.length === 0 && !hasCustomTerms) || uploading}>Ocultar datos sensibles</AppButton>
          </span>
        </div>
      </section>

      {/* Bloques 3 y 4 — qué se oculta y palabras propias, siempre visibles */}
      <CategoryPanel cats={cats} onToggle={toggleCat} onPreset={applyPreset} customTerms={customTerms} onCustomTerms={v => { setCustomTerms(v); invalidate(); }}
        whitelist={whitelist} onWhitelist={v => { setWhitelist(v); invalidate(); }} />

      {result ? (
        <div ref={outputRef} className="space-y-4" style={{ scrollMarginTop: '130px' }}>
          <h2 className="sr-only">Resultado</h2>
          <RiskSemaphore text={result.out} reviewed={reviewed} onReview={setReviewed} riskData={riskData} />

          <section className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6" aria-labelledby="output-title">
            <div className="mb-3 flex items-center justify-between flex-wrap gap-2">
              <div className="flex items-center gap-3 flex-wrap">
                <h3 id="output-title" className="font-bold text-[#222222]">Texto listo para la IA</h3>
                <span className="text-sm text-[#6b6b6b]"><strong className="text-[#222222]">{totalDetected}</strong> datos ocultados · <strong className="text-[#222222]">{byCategory.length}</strong> tipos</span>
              </div>
              <div className="flex items-center gap-3 flex-wrap text-sm">
                <button type="button" onClick={() => setShowOriginal(v => !v)} aria-expanded={showOriginal} className="font-semibold text-[#333333] underline-offset-2 hover:underline">{showOriginal ? 'Ocultar el original' : 'Ver original y resultado'}</button>
                <button type="button" onClick={openViewer} className="font-semibold text-[#333333] underline-offset-2 hover:underline">Ver como documento</button>
              </div>
            </div>
            {byCategory.length > 0 ? (
              <ul className="mb-3 flex flex-wrap gap-2" aria-label="Datos ocultados por tipo">
                {byCategory.map(c => (
                  <li key={c.id} className="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-medium text-[#222222]" style={{ backgroundColor: c.bg, boxShadow: 'inset 0 0 0 1px ' + c.border }}>
                    <span aria-hidden="true" className="h-2 w-2 rounded-full" style={{ backgroundColor: c.color }} />{c.short || c.label} <span className="font-semibold" style={{ color: c.color }}>{c.count}</span>
                  </li>
                ))}
              </ul>
            ) : null}
            {showOriginal ? (
              <div className="grid gap-4 md:grid-cols-2 mb-4">
                <div>
                  <div className="mb-2 text-xs font-semibold text-[#6b6b6b]">ORIGINAL</div>
                  <div className="rounded-2xl border border-[#e5e5e5] bg-[#fafafa] p-4 overflow-x-auto max-h-80 overflow-y-auto"><pre className="whitespace-pre-wrap break-words font-mono text-sm leading-relaxed text-[#444444]">{inputText}</pre></div>
                </div>
                <div>
                  <div className="mb-2 text-xs font-semibold text-[#b00020]">RESULTADO</div>
                  <div className="rounded-2xl border border-[#e5e5e5] bg-[#fafafa] p-4 overflow-x-auto max-h-80 overflow-y-auto"><HighlightedOutput text={result.out} reps={result.reps} cats={allCats} onExclude={excludeFromResult} /></div>
                </div>
              </div>
            ) : (
              <div className="rounded-2xl border border-[#e5e5e5] bg-[#fafafa] p-4 overflow-x-auto"><HighlightedOutput text={result.out} reps={result.reps} cats={allCats} onExclude={excludeFromResult} /></div>
            )}
            <p className="mt-2 text-xs text-[#6b6b6b]">Toca una etiqueta para ver el dato original o dejarlo visible. El ✓ indica que el número de identificación o cuenta es válido.</p>
            <div className="mt-4 flex items-center justify-between gap-3 flex-wrap border-t border-[#e5e5e5] pt-4">
              <span className="text-xs text-[#6b6b6b]">{canExport ? '«Copiar para pegar en la IA» añade una instrucción para que el modelo conserve las etiquetas.' : riskData.hits.length ? 'Para copiar: primero retira los datos que quedan por ocultar.' : 'Para copiar: marca arriba «Revisé el texto…».'}</span>
              <div className="flex gap-2 flex-wrap">
                <AppButton variant="secondary" onClick={() => copyOutput(false)} disabled={!canExport}>Copiar solo el texto</AppButton>
                <AppButton variant="secondary" onClick={() => canExport && downloadAnonText(result.out)} disabled={!canExport}>Descargar .txt</AppButton>
                <AppButton onClick={() => copyOutput(true)} disabled={!canExport}>{copied ? '✓ Copiado' : 'Copiar para pegar en la IA'}</AppButton>
              </div>
            </div>
          </section>

          {result.reps.length > 0 ? (
            <section className="rounded-[28px] border border-[#b00020] bg-white shadow-sm p-6" aria-labelledby="key-title">
              <div className="mb-3 flex items-center justify-between flex-wrap gap-2">
                <div>
                  <h3 id="key-title" className="font-bold text-[#222222]">🔑 Llave para recuperar los datos originales</h3>
                  <p className="mt-1 text-sm text-[#444444]">{keySaved ? 'Llave guardada. Úsala en «Recuperar datos reales» para volver a poner los nombres reales.' : 'Guárdala ahora. Si cierras esta pestaña sin guardarla, no podrás volver a poner los nombres reales.'}</p>
                </div>
                <div className="flex gap-2 flex-wrap">
                  <AppButton onClick={downloadKey}>{keySaved ? '✓ Llave guardada' : 'Guardar llave en mi equipo'}</AppButton>
                  <AppButton variant="secondary" onClick={copyTable}>{copiedTable ? '✓ Copiada' : 'Copiar llave'}</AppButton>
                  <AppButton variant="secondary" onClick={downloadDocs} disabled={!canExport}>Descargar Word con los originales</AppButton>
                </div>
              </div>
              {!canExport ? <p className="mb-2 text-xs text-[#6b6b6b]">El Word con los originales se activa al marcar arriba «Revisé el texto…».</p> : null}
              <p className="mb-3 text-xs text-[#6b6b6b]">La llave contiene los datos reales. Guárdala con el documento y nunca la pegues en una IA.</p>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <caption className="sr-only">Equivalencias entre etiquetas y datos originales</caption>
                  <thead><tr className="border-b border-[#e5e5e5]">
                    <th scope="col" className="py-2 pr-4 text-left font-semibold text-[#222222]">Etiqueta</th>
                    <th scope="col" className="py-2 pr-4 text-left font-semibold text-[#222222]">Dato original</th>
                    <th scope="col" className="py-2 pr-4 text-left font-semibold text-[#222222]">Veces</th>
                    <th scope="col" className="py-2 text-left font-semibold text-[#222222]">Tipo</th>
                  </tr></thead>
                  <tbody>
                    {result.reps.map((r, i) => {
                      const cat = allCats.find(c => c.id === r.catId);
                      return (
                        <tr key={i} className="border-b border-[#e5e5e5] last:border-0">
                          <td className="py-2 pr-4"><mark className="anon font-mono text-xs px-1.5 py-0.5 rounded" style={{ backgroundColor: cat ? cat.bg : '#f5f5f5', color: cat ? cat.color : '#333', border: '1.5px solid ' + (cat ? cat.color : '#9a9a9a') }}>{r.replacement}</mark></td>
                          <td className="py-2 pr-4 font-mono text-xs text-[#333333] break-all">{r.original}{r.valid === true ? <span className="ml-1 text-[#15803d]" title="Número verificado: el dígito de control es correcto">✓</span> : r.valid === false ? <span className="ml-1 text-[#b45309]" title="Tiene forma de identificación, pero el dígito de control no cuadra">?</span> : null}</td>
                          <td className="py-2 pr-4 text-xs text-[#6b6b6b]">{r.count || 1}</td>
                          <td className="py-2 text-xs text-[#6b6b6b]">{(cat && cat.short) || r.catLabel}{r.hint ? ' · rango ' + r.hint : ''}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </section>
          ) : null}
        </div>
      ) : null}

      {viewerOpen && viewerData ? (
        <DocumentViewer open={viewerOpen} onClose={() => setViewerOpen(false)} reviewed={reviewed} onReview={setReviewed} resultIdentity={viewerData.generation}
          anonText={viewerData.anonText} reps={viewerData.reps} cats={viewerData.cats} activeCats={viewerData.activeCats} fileName={viewerData.fileName} originalLen={viewerData.originalLen} whitelist={whitelist} />
      ) : null}
    </div>
  );
}

// ─── Pestaña Recuperar ────────────────────────────────────────────────────────
function RecoverTab({ lastResult }) {
  const dialogs = useDialog();
  const [mode, setMode] = useState(lastResult ? 'auto' : 'paste');
  const [mappingText, setMappingText] = useState('');
  const [modifiedText, setModifiedText] = useState('');
  const [recovered, setRecovered] = useState(null);
  const [copiedRecover, setCopiedRecover] = useState(false);
  const [status, setStatus] = useState('');
  const keyInputRef = useRef(null);

  const buildMapping = () => {
    if (mode === 'auto' && lastResult && lastResult.reps) { const map = {}; for (const r of lastResult.reps) map[r.replacement] = r.original; return map; }
    if (mode === 'paste' && mappingText.trim()) return parseEquivalences(mappingText);
    return {};
  };

  const loadKeyFile = async (file) => {
    if (!file) return;
    try { const text = await file.text(); setMappingText(text.replace(/^\uFEFF/, '')); setMode('paste'); setRecovered(null); setStatus('Llave cargada: ' + file.name); }
    catch (e) { dialogs.alert('No se pudo leer el archivo de llave.'); }
  };

  const recover = () => {
    if (!modifiedText.trim()) { dialogs.alert('Pega la respuesta de la IA.'); return; }
    let mapping;
    try { mapping = buildMapping(); }
    catch (error) { setRecovered(null); dialogs.alert(error.message, 'No se pudo leer la llave'); return; }
    if (!Object.keys(mapping).length) { dialogs.alert('No hay llave disponible. Carga el archivo de llave o pega la tabla de equivalencias.'); return; }
    const res = restoreTags(modifiedText, mapping);
    setRecovered(res);
    setStatus(res.resolved.length + ' etiquetas restauradas' + (res.repaired.length ? ', ' + res.repaired.length + ' reparadas' : '') + (res.unresolved.length ? ', ' + res.unresolved.length + ' sin resolver' : '') + '.');
  };

  const copyRecovered = () => {
    if (!recovered) return;
    copyLocalText(recovered.out, m => dialogs.alert(m)).then(ok => { if (!ok) return; setCopiedRecover(true); setTimeout(() => setCopiedRecover(false), 2000); });
  };

  const hasMappingSource = (mode === 'auto' && lastResult) || (mode === 'paste' && mappingText.trim());
  const fieldClass = "w-full rounded-2xl border border-[#9a9a9a] bg-[#fafafa] p-3 text-base sm:text-sm text-[#333333] focus:outline-none focus:border-[#b00020] focus:ring-2 focus:ring-[#b00020] resize-y";

  // Resaltar los valores restaurados en el texto recuperado.
  const highlighted = useMemo(() => {
    if (!recovered) return null;
    const values = [...new Set(recovered.resolved.map(r => r.value).filter(Boolean))].sort((a, b) => b.length - a.length);
    if (!values.length) return [recovered.out];
    const re = new RegExp('(' + values.map(escapeRegExp).join('|') + ')', 'g');
    return recovered.out.split(re);
  }, [recovered]);
  const restoredSet = useMemo(() => new Set(recovered ? recovered.resolved.map(r => r.value) : []), [recovered]);

  return (
    <div className="space-y-6">
      <LiveStatus message={status} />
      <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6">
        <h2 className="text-xl font-bold text-[#222222] mb-1">Vuelve a poner los datos reales en la respuesta de la IA</h2>
        <p className="text-sm text-[#6b6b6b]">Pega lo que te contestó la IA. Cada etiqueta como <span className="font-mono">[PERSONA_1]</span> se cambia por el dato real, aunque el modelo la haya escrito distinto.</p>
      </div>

      <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6">
        <p className="font-bold text-[#222222] mb-3" id="key-source"><span className="text-[#6b6b6b]">1 ·</span> Elige la llave</p>
        <div className="mb-4 flex gap-3 flex-wrap" role="group" aria-labelledby="key-source">
          <button type="button" onClick={() => { setMode('auto'); setRecovered(null); }} aria-pressed={mode === 'auto'}
            className={cn("flex-1 min-w-[12rem] rounded-2xl border px-4 py-3 text-sm font-semibold transition text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-[#b00020]", mode === 'auto' ? "border-2 border-[#222222] bg-[#fafafa] text-[#222222]" : "border-[#9a9a9a] text-[#333333] hover:bg-[#fafafa]")}>
            <div className="font-bold mb-0.5">{mode === 'auto' ? '✓ ' : ''}Usar la llave de esta sesión</div>
            <div className="text-xs font-normal text-[#6b6b6b]">{lastResult ? lastResult.reps.length + ' etiquetas de tu último texto' : 'Todavía no has ocultado nada en esta sesión'}</div>
          </button>
          <button type="button" onClick={() => { setMode('paste'); setRecovered(null); }} aria-pressed={mode === 'paste'}
            className={cn("flex-1 min-w-[12rem] rounded-2xl border px-4 py-3 text-sm font-semibold transition text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-[#b00020]", mode === 'paste' ? "border-2 border-[#222222] bg-[#fafafa] text-[#222222]" : "border-[#9a9a9a] text-[#333333] hover:bg-[#fafafa]")}>
            <div className="font-bold mb-0.5">{mode === 'paste' ? '✓ ' : ''}Usar una llave guardada</div>
            <div className="text-xs font-normal text-[#6b6b6b]">Sube el archivo de llave o pega la tabla del Word</div>
          </button>
        </div>
        {mode === 'paste' && (
          <div>
            <div className="mb-2 flex items-center gap-2 flex-wrap">
              <label htmlFor="mapping-text" className="text-sm font-semibold text-[#222222]">Llave guardada</label>
              <InfoIcon text="Sube el archivo que empieza por LLAVE-CONFIDENCIAL, o abre el Word con los originales, selecciona la tabla, cópiala y pégala aquí con su encabezado." />
              <AppButton variant="secondary" onClick={() => keyInputRef.current && keyInputRef.current.click()}>↑ Subir archivo de llave</AppButton>
              <input ref={keyInputRef} type="file" accept=".tsv,.txt,text/tab-separated-values,text/plain" className="hidden" aria-label="Seleccionar archivo de llave" onChange={e => { loadKeyFile(e.target.files && e.target.files[0]); e.target.value = ''; }} />
            </div>
            <textarea id="mapping-text" rows={8} value={mappingText} onChange={e => { setMappingText(e.target.value); setRecovered(null); }}
              className={cn(fieldClass, 'font-mono')} placeholder={"Etiqueta\tOriginal (JSON)\tHint\tCategoría\n[EMAIL_1]\t\"maria@empresa.com\"\t—\tCorreos electrónicos"} />
          </div>
        )}
      </div>

      <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6">
        <div className="mb-2 flex items-center gap-2">
          <label htmlFor="modified-text" className="font-bold text-[#222222]"><span className="text-[#6b6b6b]">2 ·</span> Pega la respuesta de la IA</label>
        </div>
        <textarea id="modified-text" rows={12} value={modifiedText} onChange={e => { setModifiedText(e.target.value); setRecovered(null); }} className={fieldClass}
          placeholder="Pega aquí lo que te contestó ChatGPT, Claude o Gemini. Las etiquetas entre corchetes se cambiarán por los datos reales." />
        <div className="mt-3 flex items-center gap-3 flex-wrap">
          <AppButton onClick={recover} disabled={!modifiedText.trim() || !hasMappingSource}>Recuperar datos originales</AppButton>
          {!modifiedText.trim() ? <span className="text-xs text-[#6b6b6b]">Pega una respuesta para activar el botón.</span> : !hasMappingSource ? <span className="text-xs text-[#6b6b6b]">Elige una llave arriba para activar el botón.</span> : null}
        </div>
      </div>

      {recovered ? (
        <div className="rounded-[28px] border border-[#e5e5e5] bg-white shadow-sm p-6 space-y-4">
          <div className="flex items-center gap-3 flex-wrap">
            {recovered.resolved.length > 0 && <span className="inline-flex items-center gap-1.5 rounded-xl bg-[#f0fdf4] border border-[#15803d] px-3 py-1.5 text-sm font-semibold text-[#15803d]">✓ {recovered.resolved.length} etiqueta{recovered.resolved.length !== 1 ? 's' : ''} restaurada{recovered.resolved.length !== 1 ? 's' : ''}</span>}
            {recovered.repaired.length > 0 && <span className="inline-flex items-center gap-1.5 rounded-xl bg-[#eff6ff] border border-[#1d4ed8] px-3 py-1.5 text-sm font-semibold text-[#1d4ed8]">🔧 {recovered.repaired.length} etiqueta{recovered.repaired.length !== 1 ? 's' : ''} reparada{recovered.repaired.length !== 1 ? 's' : ''} (el modelo las alteró)</span>}
            {recovered.unresolved.length > 0 && <span className="inline-flex items-center gap-1.5 rounded-xl bg-[#fffbeb] border border-[#b45309] px-3 py-1.5 text-sm font-semibold text-[#b45309]">⚠ {recovered.unresolved.length} sin resolver</span>}
            {recovered.resolved.length === 0 && recovered.unresolved.length === 0 && <span className="text-sm text-[#6b6b6b]">No se encontraron etiquetas en el texto.</span>}
          </div>
          <div>
            <div className="mb-2 flex items-center justify-between">
              <span className="text-sm font-semibold text-[#222222]">Texto recuperado</span>
              <AppButton variant="secondary" onClick={copyRecovered}>{copiedRecover ? '✓ Copiado' : '📋 Copiar'}</AppButton>
            </div>
            <div className="rounded-2xl border border-[#e5e5e5] bg-[#fafafa] p-4 max-h-96 overflow-y-auto">
              <pre className="whitespace-pre-wrap break-words text-sm leading-relaxed text-[#222222]">
                {highlighted.map((part, i) => restoredSet.has(part) ? <mark key={i} className="rounded bg-[#dcfce7] px-0.5 text-[#14532d]">{part}</mark> : <span key={i}>{part}</span>)}
              </pre>
            </div>
            <p className="mt-1.5 text-xs text-[#6b6b6b]">Los valores restaurados aparecen resaltados para que compruebes que cayeron en el lugar correcto.</p>
          </div>
          {recovered.repaired.length > 0 && (
            <details className="rounded-2xl border border-[#bfdbfe] bg-[#eff6ff] p-4 text-sm text-[#1e3a8a]">
              <summary className="cursor-pointer font-semibold">Etiquetas reparadas</summary>
              <ul className="mt-2 space-y-1 font-mono text-xs">{recovered.repaired.map((r, i) => <li key={i}>{r.found} → {r.tag}</li>)}</ul>
            </details>
          )}
          {recovered.unresolved.length > 0 && (
            <div className="rounded-2xl border border-[#b45309] bg-[#fffbeb] p-4 text-sm text-[#92400e]">
              <strong>Etiquetas sin resolver:</strong> {recovered.unresolved.join(', ')}
              <span className="block mt-1 text-xs">No estaban en la llave. Puede que correspondan a otra sustitución o que la llave esté incompleta.</span>
            </div>
          )}
        </div>
      ) : null}
    </div>
  );
}

// ─── App principal ────────────────────────────────────────────────────────────
const TABS = [
  { id: 'how', label: 'Cómo usar' },
  { id: 'work', label: '🔒 Anonimizar texto' },
  { id: 'recover', label: '🔄 Recuperar datos reales' },
  { id: 'privacy', label: 'Privacidad' },
];

function App() {
  const [tab, setTab] = useState('how');
  const [aboutOpen, setAboutOpen] = useState(false);
  const [lastResult, setLastResult] = useState(null);
  const [sessionKey, setSessionKey] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const dialogs = useDialog();
  const clearSession = async () => {
    if (!(await dialogs.confirm('¿Borrar el contenido y la llave de esta sesión? No elimina archivos descargados ni el portapapeles.', { ok: 'Borrar sesión', danger: true }))) return;
    setLastResult(null); setSessionKey(key => key + 1); setTab('how'); setAboutOpen(false); setMenuOpen(false);
  };
  const tabRefs = useRef([]);
  // Header y nav en un solo bloque sticky: así ninguna pestaña se dibuja sobre el contenido al variar la altura del header.
  const onTabKey = (e, i) => {
    if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) return;
    e.preventDefault();
    const n = TABS.length;
    const next = e.key === 'ArrowRight' ? (i + 1) % n : e.key === 'ArrowLeft' ? (i - 1 + n) % n : e.key === 'Home' ? 0 : n - 1;
    setTab(TABS[next].id); tabRefs.current[next] && tabRefs.current[next].focus();
  };

  return (
    <div className="min-h-screen bg-white">
      <a href="#main" className="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-[80] focus:rounded-xl focus:bg-[#b00020] focus:px-4 focus:py-2 focus:text-white">Saltar al contenido</a>
      <div className="sticky top-0 z-40 bg-white">
      <header className="border-b border-[#e5e5e5]">
        <div className="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-3">
          <div className="flex items-center gap-3 min-w-0">
            <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-[#b00020] text-lg font-bold text-white select-none" aria-hidden="true">F</div>
            <div className="min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-lg font-bold tracking-tight text-[#222222]">FuturIA</span>
                <span className="text-sm font-semibold text-[#6b6b6b]">Anonimizador IA</span>
              </div>
              <p className="hidden text-xs text-[#6b6b6b] sm:block">Oculta datos sensibles antes de usar ChatGPT, Claude o Gemini — gratis y 100% local</p>
            </div>
          </div>
          <div className="hidden items-center gap-2 sm:flex">
            <AppButton variant="secondary" onClick={clearSession}>Borrar sesión</AppButton>
            <AppButton variant="secondary" onClick={() => setAboutOpen(true)}>Acerca de</AppButton>
          </div>
          <div className="relative sm:hidden">
            <button type="button" aria-expanded={menuOpen} aria-haspopup="menu" aria-label="Menú" onClick={() => setMenuOpen(v => !v)}
              className="min-h-[44px] min-w-[44px] rounded-2xl border border-[#9a9a9a] px-3 text-lg">☰</button>
            {menuOpen ? (
              <div role="menu" className="absolute right-0 top-12 z-50 w-48 rounded-2xl border border-[#9a9a9a] bg-white p-2 shadow-xl">
                <button role="menuitem" type="button" onClick={clearSession} className="block min-h-[44px] w-full rounded-xl px-3 text-left text-sm font-semibold hover:bg-[#fff5f6]">Borrar sesión</button>
                <button role="menuitem" type="button" onClick={() => { setAboutOpen(true); setMenuOpen(false); }} className="block min-h-[44px] w-full rounded-xl px-3 text-left text-sm font-semibold hover:bg-[#fff5f6]">Acerca de</button>
              </div>
            ) : null}
          </div>
        </div>
      </header>

      <nav className="border-b border-[#e5e5e5]" aria-label="Secciones">
        <div className="mx-auto flex max-w-7xl items-center gap-1 overflow-x-auto px-5 py-2" role="tablist">
          {TABS.map((t, i) => (
            <button key={t.id} ref={el => tabRefs.current[i] = el} role="tab" id={'tab-' + t.id} aria-selected={tab === t.id} aria-controls={'panel-' + t.id} tabIndex={tab === t.id ? 0 : -1}
              onClick={() => setTab(t.id)} onKeyDown={e => onTabKey(e, i)}
              className={cn("min-h-[44px] shrink-0 rounded-xl px-4 py-2 text-sm font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-[#b00020]",
                tab === t.id ? "bg-[#fff5f6] text-[#b00020] border border-[#b00020]" : "text-[#333333] hover:bg-[#fff5f6]")}>
              {t.label}
            </button>
          ))}
        </div>
      </nav>
      </div>

      <main id="main" key={sessionKey} tabIndex={-1} className="mx-auto max-w-7xl px-5 py-8 outline-none" role="tabpanel" aria-labelledby={'tab-' + tab}>
        {tab === 'work' ? <WorkTab setLastResult={setLastResult} lastResult={lastResult} /> : null}
        {tab === 'recover' ? <RecoverTab lastResult={lastResult} /> : null}
        {tab === 'how' ? <HowToTab onStart={() => setTab('work')} /> : null}
        {tab === 'privacy' ? <PrivacyTab /> : null}
      </main>

      <footer className="border-t border-[#e5e5e5] py-6 text-center text-xs text-[#6b6b6b]">
        FuturIA Anonimizador IA v{APP_VERSION} — gratis · todo ocurre en tu navegador · no guarda nada · revisa siempre el resultado.
        {' · '}
        <a href="https://futuria.substack.com/" target="_blank" rel="noreferrer" className="text-[#b00020] hover:underline">futuria.substack.com</a>
      </footer>

      <AboutModal open={aboutOpen} onClose={() => setAboutOpen(false)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DialogProvider><App /></DialogProvider>);
</script>
</body>
</html>
