// ─── Money range formatter ────────────────────────────────────────────────────
function formatMoneyRange(value) {
  const cleaned = String(value).replace(/\./g, '').replace(/,/g, '.');
  const n = parseFloat(cleaned);
  if (isNaN(n)) return null;
  const low = Math.max(0, Math.round(n * 0.90));
  const high = Math.round(n * 1.10);
  const fmt = v => new Intl.NumberFormat('es-ES').format(v);
  return '$~' + fmt(low) + '–' + fmt(high);
}

// ─── Categoría de términos personalizados ────────────────────────────────────
const CUSTOM_CAT = {
  id: 'custom', label: 'Término personalizado', tag: 'PERSONALIZADO', icon: '✏️',
  color: '#374151', bg: '#f9fafb', border: '#d1d5db',
};

// ─── Utilidades del motor ─────────────────────────────────────────────────────
function patternOf(p) { return p instanceof RegExp ? { re: p } : p; }
function normalizeEntity(value) {
  return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
}
function parseTermList(text) {
  return [...new Set(String(text || '').split('\n').map(t => t.trim()).filter(t => t.length >= 2))];
}
function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function buildWhitelistRanges(source, whitelist) {
  const ranges = [];
  for (const term of parseTermList(whitelist)) {
    const re = new RegExp(escapeRegExp(term), 'gi');
    for (const m of source.matchAll(re)) ranges.push({ start: m.index, end: m.index + m[0].length });
  }
  return ranges.sort((a, b) => a.start - b.start);
}
function overlapsRange(ranges, start, end) {
  return ranges.some(r => start < r.end && end > r.start);
}

// ─── Lógica de anonimización ──────────────────────────────────────────────────
function runAnonymize(text, activeCats, customTerms, options = {}) {
  const source = String(text || '');
  const reps = [], candidates = [], selected = [];
  const protectedTags = [...source.matchAll(/\[[A-Z_]+_\d+\]/g)].map(m => ({ start: m.index, end: m.index + m[0].length }));
  const usedTags = new Set(source.match(/\[[A-Z_]+_\d+\]/g) || []);
  const whitelistRanges = buildWhitelistRanges(source, options.whitelist);
  const collect = (pat, cat, priority, capture = 0) => {
    const { re, validate, requireValid } = patternOf(pat);
    re.lastIndex = 0;
    for (const match of source.matchAll(re)) {
      let start = match.index;
      const end = start + match[capture].length;
      if (end <= start) continue;
      const value = match[capture];
      let valid = null;
      if (validate) {
        valid = VALIDATORS[validate](value);
        if (requireValid && !valid) continue;
      }
      if (whitelistRanges.length && overlapsRange(whitelistRanges, start, end)) continue;
      // Buscar la primera etiqueta que puede cruzarse; conservar los extremos sensibles.
      let lo = 0, hi = protectedTags.length;
      while (lo < hi) {
        const mid = (lo + hi) >>> 1;
        if (protectedTags[mid].end <= start) lo = mid + 1; else hi = mid;
      }
      const add = (from, to) => {
        if (from < to) candidates.push({ start: from, end: to, cat, priority: valid === true ? priority - 0.5 : priority, length: to - from, valid });
      };
      for (let i = lo; i < protectedTags.length && protectedTags[i].start < end; i++) {
        add(start, protectedTags[i].start);
        start = protectedTags[i].end;
      }
      add(start, end);
    }
  };
  for (const cat of activeCats) {
    const pats = cat.id === 'person' ? getPersonPatterns(source) : cat.pats;
    for (const pat of pats) collect(pat, cat, ['credentials', 'email', 'url', 'financial', 'ip', 'fiscal', 'phone', 'birthdate'].includes(cat.id) ? 0 : 2);
  }
  for (const term of parseTermList(customTerms)) {
    // Lookahead con captura: enumera también ocurrencias solapadas del mismo término.
    collect(new RegExp('(?=(' + escapeRegExp(term) + '))', 'gi'), CUSTOM_CAT, 1, 1);
  }
  // Unión por posición: ninguna coincidencia parcial puede dejar un sufijo sensible.
  candidates.sort((a, b) => a.start - b.start || b.length - a.length || a.priority - b.priority);
  for (const item of candidates) {
    const last = selected[selected.length - 1];
    if (!last || item.start >= last.end) { selected.push({ ...item }); continue; }
    last.end = Math.max(last.end, item.end);
    // Un término explícito manda en la unión; los correos siempre se cubren completos.
    if (item.cat.id === 'custom' || (last.cat.id !== 'custom' &&
        (item.priority < last.priority || (item.priority === last.priority && item.length > last.length)))) {
      last.cat = item.cat; last.priority = item.priority; last.length = item.length; last.valid = item.valid;
    }
  }
  // Misma entidad (categoría + original normalizado) → misma etiqueta en todo el texto.
  const counters = {}, entityTags = new Map(), repByTag = new Map();
  let cursor = 0, out = '';
  for (const item of selected) {
    const cat = item.cat;
    const original = source.slice(item.start, item.end);
    const key = cat.id + '\u0000' + normalizeEntity(original);
    let tag = entityTags.get(key);
    if (!tag) {
      do { counters[cat.id] = (counters[cat.id] || 0) + 1; tag = '[' + cat.tag + '_' + counters[cat.id] + ']'; } while (usedTags.has(tag));
      usedTags.add(tag);
      entityTags.set(key, tag);
      const hint = cat.id === 'money' ? formatMoneyRange(original.replace(/[^\d.,]/g, '')) : null;
      const rep = { original, replacement: tag, catId: cat.id, catLabel: cat.label, hint, valid: item.valid === undefined ? null : item.valid, count: 0 };
      reps.push(rep); repByTag.set(tag, rep);
    }
    repByTag.get(tag).count += 1;
    out += source.slice(cursor, item.start) + tag;
    cursor = item.end;
  }
  return { out: out + source.slice(cursor), reps };
}

// ─── Revisión residual: usa los mismos patrones que el motor ───────────────────
// activeIds (opcional): solo las categorías activas bloquean; las inactivas se listan como avisos.
function computeResidualRisk(text, activeIds = null, options = {}) {
  const hits = [], warnings = [];
  // Las etiquetas ya presentes no son datos originales ni se vuelven a escanear.
  let plain = String(text || '').replace(/\[[A-Z_]+_\d+\]/g, '');
  for (const term of parseTermList(options.whitelist)) plain = plain.split(term).join('');
  for (const cat of CATS) {
    const patterns = cat.id === 'person' ? getPersonPatterns(plain) : cat.pats;
    const found = patterns.some(p => {
      const { re, validate, requireValid } = patternOf(p);
      re.lastIndex = 0;
      for (const m of plain.matchAll(re)) {
        if (requireValid && !VALIDATORS[validate](m[0])) continue;
        return true;
      }
      return false;
    });
    if (!found) continue;
    if (activeIds && !activeIds.includes(cat.id)) warnings.push(cat.label); else hits.push(cat.label);
  }
  // score se conserva como contador para compatibilidad interna; NO es porcentaje.
  return { score: hits.length, hits, warnings };
}

function getRiskInfo(score, reviewed = false) {
  if (score > 0) return { label: 'Quedan datos por ocultar', emoji: '🔴', color: '#dc2626', bg: '#fef2f2', border: '#fecaca' };
  if (reviewed) return { label: 'Revisado. Listo para copiar', emoji: '🟢', color: '#166534', bg: '#f0fdf4', border: '#86efac' };
  return { label: 'Revisa antes de copiar', emoji: '🟡', color: '#b45309', bg: '#fffbeb', border: '#fcd34d' };
}

// ─── Recuperación tolerante: repara etiquetas deformadas por el LLM ───────────
const TAG_ALIASES = { PERSON: 'PERSONA', NAME: 'PERSONA', CREDENTIAL: 'CREDENCIAL', PHONE: 'TELEFONO', TELEPHONE: 'TELEFONO', ACCOUNT: 'CUENTA', TAX_ID: 'ID_FISCAL', TAXID: 'ID_FISCAL', FISCAL_ID: 'ID_FISCAL', ID: 'ID_FISCAL', AMOUNT: 'MONTO', MONEY: 'MONTO', ADDRESS: 'DIRECCION', COMPANY: 'EMPRESA', DATE: 'FECHA', BIRTHDATE: 'NACIMIENTO', BIRTH: 'NACIMIENTO', CUSTOM: 'PERSONALIZADO', MAIL: 'EMAIL', CORREO: 'EMAIL', TELÉFONO: 'TELEFONO', DIRECCIÓN: 'DIRECCION' };
function canonicalTag(kind, num) {
  let k = String(kind).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\s\-]+/g, '_');
  k = TAG_ALIASES[k] || k;
  return '[' + k + '_' + String(+num) + ']';
}
function restoreTags(text, mapping) {
  const source = String(text || '');
  const resolved = [], unresolved = new Set(), repaired = [];
  const seen = new Set();
  // 1) Etiquetas exactas. 2) Variantes: espacios/guiones, minúsculas, sin corchetes, alias en inglés, espacios internos.
  // Sin corchetes solo se acepta un tipo conocido (en cualquier caja), para no tocar identificadores normales como foo_1.
  const knownKinds = [...new Set([...Object.keys(TAG_ALIASES), ...Object.values(TAG_ALIASES), 'PERSONA', 'EMAIL', 'URL', 'IP', 'CREDENCIAL', 'CUENTA', 'ID_FISCAL', 'TELEFONO', 'MONTO', 'NACIMIENTO', 'DIRECCION', 'EMPRESA', 'FECHA', 'PERSONALIZADO'])].sort((a, b) => b.length - a.length).join('|');
  const loose = new RegExp('\\[\\s*([A-Za-zÁÉÍÓÚÑáéíóúñ][A-Za-zÁÉÍÓÚÑáéíóúñ_\\s\\-]*?)[\\s_\\-]+(\\d+)\\s*\\]|(?<![\\p{L}\\p{N}_\\[])(' + knownKinds + ')_(\\d+)(?![\\p{L}\\p{N}_\\]])', 'giu');
  const out = source.replace(loose, (whole, kindA, numA, kindB, numB) => {
    const kind = kindA ?? kindB, num = numA ?? numB;
    const canonical = canonicalTag(kind.trim(), num);
    if (mapping[canonical] === undefined) {
      if (/^\[[A-Z_]+_\d+\]$/.test(whole)) unresolved.add(whole);
      return whole; // «[anexo 1]» o etiquetas ajenas se dejan intactas
    }
    if (!seen.has(canonical)) { seen.add(canonical); resolved.push({ tag: canonical, value: mapping[canonical] }); }
    if (whole !== canonical) repaired.push({ found: whole, tag: canonical });
    return mapping[canonical];
  });
  return { out, resolved, unresolved: [...unresolved], repaired };
}

// ─── Mapas TSV: JSON solo cuando el encabezado lo declara ─────────────────────
function serializeEquivalences(reps) {
  return ['Etiqueta\tOriginal (JSON)\tHint\tCategoría', ...reps.map(r =>
    [r.replacement, JSON.stringify(r.original), r.hint || '—', r.catLabel].join('\t'))].join('\n');
}

function parseEquivalences(text) {
  const lines = String(text || '').split(/\r\n|\n|\r/);
  const header = lines.findIndex(line => {
    const cells = line.split('\t');
    return cells[0].replace(/^\uFEFF/, '').trim() === 'Etiqueta' &&
      /^(?:Dato )?Original \(JSON\)$/i.test((cells[1] || '').trim());
  });
  const jsonFormat = header !== -1;
  const map = {};
  for (let i = jsonFormat ? header + 1 : 0; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cells = lines[i].split('\t');
    const tag = cells[0].trim();
    if (!/^\[[A-Z_]+_\d+\]$/.test(tag)) {
      if (jsonFormat) throw new Error('Formato de mapa inválido en la línea ' + (i + 1) + ': se esperaba una etiqueta.');
      continue; // Encabezados y notas de los mapas TSV clásicos.
    }
    if (cells.length < 2) throw new Error('Formato de mapa inválido en la línea ' + (i + 1) + ': falta el original.');
    let original = cells[1];
    if (jsonFormat) {
      try {
        original = JSON.parse(original);
        if (typeof original !== 'string') throw new Error();
      } catch {
        throw new Error('Formato JSON inválido en la línea ' + (i + 1) + ': el original debe ser una cadena JSON. Copia la tabla completa, incluido el encabezado.');
      }
    }
    if (map[tag] !== undefined && map[tag] !== original) throw new Error('Formato de mapa inválido: etiqueta duplicada con originales distintos.');
    map[tag] = original; // No normalizar espacios, tabulaciones ni saltos del original.
  }
  return map;
}

// ─── Popover anclado: se dibuja en un portal fijo bajo el disparador, nunca sobre el texto del flujo ───
function AnchoredPopover({ anchorRef, open, onClose, children, role = 'dialog', label, id }) {
  const [pos, setPos] = useState(null);
  React.useLayoutEffect(() => {
    if (!open || !anchorRef.current) { setPos(null); return; }
    const place = () => {
      const r = anchorRef.current.getBoundingClientRect();
      const width = Math.min(320, window.innerWidth - 16);
      const left = Math.max(8, Math.min(r.left, window.innerWidth - width - 8));
      const below = r.bottom + 6;
      const fitsBelow = below + 160 < window.innerHeight;
      setPos({ left, top: fitsBelow ? below : null, bottom: fitsBelow ? null : window.innerHeight - r.top + 6, width });
    };
    place();
    // Al desplazar o redimensionar se cierra: un popover que viaja con el scroll acaba tapando el header.
    const dismiss = () => onClose();
    window.addEventListener('scroll', dismiss, true); window.addEventListener('resize', dismiss);
    const onDoc = e => { if (!anchorRef.current.contains(e.target) && !e.target.closest('[data-popover]')) onClose(); };
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onKey);
    return () => { window.removeEventListener('scroll', dismiss, true); window.removeEventListener('resize', dismiss); document.removeEventListener('mousedown', onDoc); document.removeEventListener('keydown', onKey); };
  }, [open]);
  if (!open || !pos) return null;
  return ReactDOM.createPortal(
    <div data-popover id={id} role={role} aria-label={label}
      style={{ position: 'fixed', left: pos.left, top: pos.top ?? 'auto', bottom: pos.bottom ?? 'auto', width: pos.width, zIndex: 65 }}
      className="rounded-xl border border-[#9a9a9a] bg-white p-3 font-sans text-xs font-normal leading-relaxed text-[#222222] shadow-xl whitespace-normal">
      {children}
    </div>, document.body);
}

const DialogContext = React.createContext(null);
function DialogProvider({ children }) {
  const [dialog, setDialog] = useState(null);
  const [toast, setToast] = useState('');
  const api = useMemo(() => ({
    alert: (message, title = 'Aviso') => new Promise(resolve => setDialog({ title, message, buttons: [{ label: 'Entendido', value: true, primary: true }], resolve })),
    confirm: (message, { title = 'Confirmar', ok = 'Continuar', cancel = 'Cancelar', danger = false } = {}) => new Promise(resolve => setDialog({ title, message, danger, buttons: [{ label: cancel, value: false }, { label: ok, value: true, primary: true }], resolve })),
    notify: (message) => { setToast(message); setTimeout(() => setToast(''), 2500); },
  }), []);
  const close = value => { const d = dialog; setDialog(null); d && d.resolve(value); };
  const ref = useRef(null);
  React.useEffect(() => {
    if (!dialog) return;
    const prev = document.activeElement;
    const node = ref.current; node && node.querySelector('button[data-primary]')?.focus();
    const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); close(false); } };
    document.addEventListener('keydown', onKey, true);
    return () => { document.removeEventListener('keydown', onKey, true); prev && prev.isConnected && prev.focus(); };
  }, [dialog]);
  return (
    <DialogContext.Provider value={api}>
      {children}
      <div role="status" aria-live="polite" className="sr-only">{toast}</div>
      {toast ? <div className="fixed bottom-4 left-1/2 z-[60] -translate-x-1/2 rounded-2xl bg-[#222222] px-4 py-3 text-sm font-semibold text-white shadow-xl" aria-hidden="true">{toast}</div> : null}
      {dialog ? (
        <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/40 p-4" onClick={() => close(false)}>
          <div ref={ref} role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-msg" onClick={e => e.stopPropagation()}
            className="w-full max-w-md rounded-[28px] bg-white p-6 shadow-2xl">
            <h2 id="dlg-title" className="mb-2 text-lg font-bold text-[#222222]">{dialog.title}</h2>
            <p id="dlg-msg" className="whitespace-pre-wrap text-sm leading-relaxed text-[#333333]">{dialog.message}</p>
            <div className="mt-5 flex flex-wrap justify-end gap-2">
              {dialog.buttons.map(b => (
                <AppButton key={b.label} variant={b.primary ? 'primary' : 'secondary'} onClick={() => close(b.value)} className={b.primary && dialog.danger ? 'bg-[#dc2626] hover:bg-[#b91c1c]' : ''}>
                  <span data-primary={b.primary || undefined}>{b.label}</span>
                </AppButton>
              ))}
            </div>
          </div>
        </div>
      ) : null}
    </DialogContext.Provider>
  );
}

// Sin límite, un PDF de cientos de páginas congela la pestaña sin explicar nada:
// el navegador deja de responder y el usuario no sabe si falló o sigue trabajando.
const MAX_FILE_MB = 25;
const MAX_FILE_BYTES = MAX_FILE_MB * 1024 * 1024;
const MAX_PDF_PAGES = 300;
const AVISO_PAGINAS = 40;   // a partir de aquí se avisa de que tardará

function formatMB(bytes) {
  return (bytes / (1024 * 1024)).toFixed(1).replace('.', ',') + ' MB';
}

// ─── Reconstrucción del texto de una página de PDF ───────────────────────────
// pdf.js entrega fragmentos sueltos con su posición en la página. Unirlos todos
// con espacios (`items.map(i => i.str).join(' ')`) aplasta el documento entero en
// una sola línea: el visor reparte párrafos por línea en blanco y, sin saltos, un
// documento de 12 páginas sale como un único bloque ilegible.
// Aquí se agrupan los fragmentos por coordenada vertical (cada Y distinta es una
// línea) y se infiere el salto de párrafo cuando el hueco entre líneas supera de
// forma clara el interlineado normal.
function reconstructPageText(items) {
  if (!items || !items.length) return '';

  const lineas = [];
  let actual = null;
  for (const item of items) {
    const str = item.str;
    if (typeof str !== 'string') continue;
    // transform = [a, b, c, d, e, f]; f es la coordenada Y del fragmento.
    const y = item.transform ? item.transform[5] : 0;
    const alto = item.height || Math.abs(item.transform ? item.transform[3] : 12) || 12;

    if (actual && Math.abs(actual.y - y) <= Math.max(2, alto * 0.5)) {
      // mismo renglón: pdf.js ya marca con hasEOL dónde termina la línea real
      actual.partes.push(str);
    } else {
      if (actual) lineas.push(actual);
      actual = { y: y, alto: alto, partes: [str] };
    }
    if (item.hasEOL) {
      lineas.push(actual);
      actual = null;
    }
  }
  if (actual) lineas.push(actual);

  // Texto de cada línea, sin introducir espacios donde el PDF no los tiene.
  const textos = lineas.map(l => l.partes.join('').replace(/\s+/g, ' ').trim());

  // Interlineado típico de la página: la mediana de los saltos verticales.
  const saltos = [];
  for (let i = 1; i < lineas.length; i++) {
    const d = Math.abs(lineas[i - 1].y - lineas[i].y);
    if (d > 0.5) saltos.push(d);
  }
  saltos.sort((a, b) => a - b);
  const interlineado = saltos.length ? saltos[Math.floor(saltos.length / 2)] : 0;

  let out = '';
  for (let i = 0; i < lineas.length; i++) {
    const texto = textos[i];
    if (i === 0) { out = texto; continue; }
    const salto = Math.abs(lineas[i - 1].y - lineas[i].y);
    // Hueco claramente mayor que el interlineado = párrafo nuevo.
    const nuevoParrafo = interlineado > 0 && salto > interlineado * 1.6;
    if (!texto) { out += '\n'; continue; }
    out += (nuevoParrafo ? '\n\n' : '\n') + texto;
  }

  // Normalizar: nunca más de una línea en blanco seguida.
  return out.replace(/\n{3,}/g, '\n\n').trim();
}

              <mark key={i}
                aria-label={cat.label + ': ' + part}
                style={{ backgroundColor: cat.bg, color: cat.color, border: '1.5px solid ' + cat.color, borderRadius: '4px', padding: '0 3px', fontFamily: 'monospace', fontSize: '0.88em' }}>
                <span aria-hidden="true">{cat.icon ? cat.icon + ' ' : ''}</span>{part}
              </mark>
            );
          }
          return <span key={i}>{part}</span>;
        })}
      </p>
    );
  };

  const paragraphs = text.split(/\n\n+/);
  return (
    <div>
      {paragraphs.map((para, i) => para.trim() ? renderInline(para, i) : <br key={i} />)}
    </div>
  );
}

// ─── Descarga Word (.doc) ─────────────────────────────────────────────────────
function escXml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// onError se inyecta desde los componentes (diálogo propio); sin él, se informa por consola.
async function copyLocalText(text, onError) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const message = 'No se pudo copiar al portapapeles. Comprueba los permisos del navegador o utiliza la descarga correspondiente.';
    if (onError) onError(message); else console.warn(message);
    return false;
  }
}

function downloadAnonText(text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'texto-revisado-' + new Date().toISOString().slice(0, 10) + '.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ─── Descarga combinada: tabla de equivalencias (pág. 1) + texto anonimizado ──
// Quien llama decide la confirmación (diálogo propio) y ya comprobó el riesgo con sus categorías activas.
async function downloadCombinedDoc({ anonText, reps, cats, activeCats, riskScore, riskLabel, timestamp, originalLen, reviewed = false, confirm }) {
  if (!reviewed || computeResidualRisk(anonText, (activeCats || []).map(c => c.id)).hits.length) return false;
  const ask = confirm || (message => Promise.resolve(window.confirm(message)));
  if (!(await ask('Este respaldo CONFIDENCIAL contiene los datos originales y la tabla de equivalencias. Se guardará en tu computador y puede sincronizarse si eliges una carpeta en la nube. No lo envíes a un modelo de IA. ¿Quieres descargarlo?'))) return false;
  const dateStr = new Date().toISOString().slice(0, 10);
  const catMap = {};
  cats.forEach(c => { catMap[c.id] = c; });
  const countByCat = {};
  activeCats.forEach(c => { countByCat[c.id] = 0; });
  reps.forEach(r => { if (countByCat[r.catId] !== undefined) countByCat[r.catId]++; });
  const reviewLabel = 'Revisión manual confirmada — no certifica anonimización completa';

  const [tableHeader, ...equivalenceRows] = serializeEquivalences(reps).split('\n').map(line => line.split('\t'));
  const tableRows = equivalenceRows.map((cells, idx) => {
    const r = reps[idx];
    const cat = catMap[r.catId];
    const tagStyle = cat ? 'background:' + cat.bg + ';color:' + cat.color + ';border:1pt solid ' + cat.border + ';padding:0 3pt;' : '';
    const rowClass = idx % 2 === 1 ? ' class="alt"' : '';
    return '<tr' + rowClass + '>' +
      '<td><span class="tag" style="' + tagStyle + '">' + escXml(r.replacement) + '</span></td>' +
      '<td style="white-space:pre-wrap"><span style="mso-spacerun:yes">' + escXml(cells[1]) + '</span></td>' +
      '<td>' + escXml(cells[2]) + '</td>' +
      '<td>' + escXml(cells[3]) + '</td>' +
      '</tr>';
  }).join('\n');

  const summaryRows = activeCats.map((c, idx) => {
    const rowClass = idx % 2 === 1 ? ' class="alt"' : '';
    return '<tr' + rowClass + '><td>' + escXml(c.label) + '</td><td><span class="tag">[' + escXml(c.tag) + '_N]</span></td><td>' + (countByCat[c.id] || 0) + '</td></tr>';
  }).join('\n');

  const anonParas = anonText.split(/\n\n+/).map(p => p.trim()).filter(p => p)
    .map(p => '<p class="body-p">' + escXml(p).replace(/\n/g, '<br>') + '</p>').join('\n');

  const body = [
    // ── Página 1: Tabla de equivalencias ──
    '<h1>Tabla de equivalencias</h1>',
    '<p class="meta">FuturIA Anonimizador IA &nbsp;&middot;&nbsp; ' + escXml(timestamp) + '<br>',
    'Total de reemplazos: <strong>' + reps.length + '</strong> &nbsp;&middot;&nbsp; ' + reviewLabel + '</p>',
    '<div class="instr">',
    '<p style="margin:0 0 6pt 0;"><strong>¿Qué es esta tabla?</strong> Mapeo completo entre cada etiqueta del texto anonimizado y el dato original que reemplaza. Es el único lugar donde aparecen los datos sin anonimizar.</p>',
    '<p style="margin:0 0 6pt 0;"><strong>¿Cómo usarla?</strong> Guárdala en un lugar seguro. Copia la tabla completa, incluido el encabezado, y pégala en Recuperar. La columna "Original (JSON)" conserva exactamente espacios, tabulaciones y saltos de línea; la app la decodifica al recuperar.</p>',
    '<p style="margin:0;"><strong>⚠ Confidencialidad:</strong> este archivo contiene los datos originales. Trátalo con el mismo nivel de confidencialidad que el documento fuente. No lo compartas con modelos de IA.</p>',
    '</div>',
    '<h2>Detalle de reemplazos (' + reps.length + ')</h2>',
    '<table>',
    '<tr>' + tableHeader.map(label => '<th>' + escXml(label) + '</th>').join('') + '</tr>',
    tableRows,
    '</table>',
    '<h2>Resumen por categoría</h2>',
    '<table>',
    '<tr><th>Categoría</th><th>Etiqueta</th><th>Reemplazos</th></tr>',
    summaryRows,
    '</table>',
    // ── Salto de página Word-compatible ──
    '<br clear="all" style="mso-special-character:line-break;page-break-before:always">',
    // ── Página siguiente: Texto anonimizado ──
    '<h1>Texto anonimizado</h1>',
    '<p class="meta">FuturIA Anonimizador IA &nbsp;&middot;&nbsp; ' + escXml(timestamp) + '<br>',
    'Caracteres originales: ' + originalLen.toLocaleString() + ' &nbsp;&middot;&nbsp; Anonimizados: ' + anonText.length.toLocaleString() + '<br>',
    reviewLabel + '</p>',
    '<p class="note">Este archivo contiene los originales en su primera parte. NO envíes el archivo a un modelo. Utiliza la descarga separada de texto .txt y comprueba su contenido antes de compartir.</p>',
    anonParas,
    '<p class="footer">Procesado 100% en navegador &mdash; sin servidores, sin historial automático. &nbsp; futuria.substack.com</p>',
  ].join('\n');

  downloadWordDoc('respaldo-CONFIDENCIAL-' + dateStr, 'Respaldo confidencial — FuturIA', body);
  return true;
}

// ─── Visor de documento modal ─────────────────────────────────────────────────
function DocumentViewer({ open, onClose, anonText, reps, cats, activeCats, fileName, originalLen, resultIdentity, reviewed: parentReviewed, onReview, whitelist }) {
  const [showMarks, setShowMarks] = React.useState(true);
  const [ownReviewed, setOwnReviewed] = React.useState(null);
  const dialogs = useDialog();
  const identity = resultIdentity === undefined ? reps : resultIdentity;
  const reviewed = parentReviewed === undefined ? ownReviewed === identity : parentReviewed;
  const setReviewed = onReview || (value => setOwnReviewed(value ? identity : null));
  const dialogRef = React.useRef(null);
  const closeRef = React.useRef(onClose);
  closeRef.current = onClose;
  React.useLayoutEffect(() => {
    if (!open) return;
    const root = document.getElementById('root');
    const previousFocus = document.activeElement;
    const previousInert = root ? root.inert : false;
    const dialog = dialogRef.current;
    if (root) root.inert = true;
    const focusable = () => [...dialog.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])')]
      .filter(node => !node.closest('[hidden], [inert]') && node.getClientRects().length);
    const focusFirst = () => (focusable()[0] || dialog).focus();
    focusFirst();
    const onKeyDown = event => {
      if (event.key === 'Escape') {
        event.preventDefault(); event.stopPropagation(); closeRef.current(); return;
      }
      if (event.key !== 'Tab') return;
      const nodes = focusable();
      const first = nodes[0], last = nodes[nodes.length - 1];
      const active = document.activeElement;
      if (!nodes.length) { event.preventDefault(); dialog.focus(); }
      else if (!dialog.contains(active) || active === dialog || (event.shiftKey ? active === first : active === last)) {
        event.preventDefault(); (event.shiftKey ? last : first).focus();
      }
    };
    const onFocus = event => { if (!dialog.contains(event.target)) focusFirst(); };
    document.addEventListener('keydown', onKeyDown, true);
    document.addEventListener('focusin', onFocus, true);
    return () => {
      document.removeEventListener('keydown', onKeyDown, true);
      document.removeEventListener('focusin', onFocus, true);
      if (root) root.inert = previousInert;
      if (previousFocus && previousFocus.isConnected && !previousFocus.closest('[inert]')) previousFocus.focus();
    };
  }, [open]);
  if (!open) return null;

  const activeIds = (activeCats || []).map(c => c.id);
  const riskData = computeResidualRisk(anonText, activeIds, { whitelist });
  const riskInfo = getRiskInfo(riskData.score, reviewed);
  const canExport = reviewed && riskData.hits.length === 0;

  const handlePrint = () => {
    if (!canExport) return;
    const catMap = {};
    cats.forEach(c => { catMap[c.id] = c; });
    const repMap = {};
    reps.forEach(r => { repMap[r.replacement] = r; });
    const tagPattern = /(\[[A-Z_]+_\d+\])/g;

    // Respeta «Sin marcas» y nunca incluye pistas de rango en papel.
    const paragraphsHtml = anonText.split(/\n\n+/).filter(p => p.trim()).map(para => {
      const parts = para.split(tagPattern);
      const inner = parts.map(part => {
        const rep = repMap[part];
        if (rep) {
          const cat = catMap[rep.catId];
          if (cat && showMarks) return '<mark style="background-color:' + cat.bg + ';color:' + cat.color + ';border:1.5px solid ' + cat.color + ';border-radius:4px;padding:0 3px;font-family:monospace;font-size:0.88em">' + escXml(part) + '</mark>';
          return '<span style="font-family:monospace;font-size:0.88em">' + escXml(part) + '</span>';
        }
        return escXml(part);
      }).join('');
      return '<p style="margin-bottom:1.1em;line-height:1.75;white-space:pre-wrap;mso-line-height-rule:exactly">' + inner + '</p>';
    }).join('');

    const dateStr = new Date().toLocaleString('es');
    const printHtml = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Documento seudonimizado — FuturIA</title><style>' +
      '@page{margin:2cm}body{font-family:Arial,sans-serif;font-size:11pt;color:#222;margin:0}' +
      'h1{font-size:16pt;color:#b00020;margin-bottom:6pt}' +
      '.meta{font-size:9pt;color:#6b6b6b;margin-bottom:20pt;border-bottom:1px solid #e5e5e5;padding-bottom:8pt}' +
      '.footer{margin-top:32pt;font-size:8pt;color:#6b6b6b;border-top:1px solid #e5e5e5;padding-top:8pt}' +
      '</style></head><body>' +
      '<h1>Documento seudonimizado</h1>' +
      '<div class="meta">FuturIA Anonimizador IA &nbsp;·&nbsp; ' + escXml(dateStr) + '<br>' +
      'Revisión: ' + escXml(riskInfo.label) + '. Reversible con la llave de recuperación; no certifica anonimización completa.</div>' +
      paragraphsHtml +
      '<div class="footer">Procesado 100% en navegador — sin servidores, sin historial automático. futuria.substack.com</div>' +
      '</body></html>';

    // iframe oculto: no depende de pop-ups ni de un temporizador; se imprime al cargar.
    const frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden', 'true');
    frame.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
    frame.srcdoc = printHtml;
    frame.onload = () => {
      try { frame.contentWindow.focus(); frame.contentWindow.print(); }
      catch (e) { dialogs && dialogs.alert('No se pudo abrir el diálogo de impresión. Usa «Descargar texto .txt» o «Guardar como PDF» desde el menú del navegador.'); }
      setTimeout(() => frame.remove(), 60000);
    };
    document.body.appendChild(frame);
  };

  const handleDownload = () => {
    if (!canExport) return;
    downloadCombinedDoc({
      anonText,
      reps,
      cats,
      activeCats,
      riskScore: riskData.score,
      riskLabel: riskInfo.label,
      reviewed,
      timestamp: new Date().toLocaleString('es'),
      originalLen: originalLen || anonText.length,
      confirm: m => dialogs ? dialogs.confirm(m, { ok: 'Descargar respaldo', danger: true }) : Promise.resolve(window.confirm(m)),
    });
  };

  return ReactDOM.createPortal(
    <div ref={dialogRef} tabIndex={-1} className="no-print fixed inset-0 z-50 flex flex-col" style={{ backgroundColor: '#f0f0f0' }} role="dialog" aria-modal="true" aria-label={'Documento seudonimizado. ' + riskInfo.label}>
      {/* Toolbar */}
      <div className="shrink-0 border-b border-[#e5e5e5] bg-white shadow-sm">
        <div className="flex flex-wrap items-center gap-2 px-5 py-3">
          <button onClick={onClose}
            className="flex min-h-[44px] items-center gap-1.5 rounded-xl border border-[#9a9a9a] px-3 py-2 text-sm font-semibold text-[#333333] hover:bg-[#fff5f6] transition focus:outline-none focus-visible:ring-2 focus-visible:ring-[#b00020]">
            ← Cerrar
          </button>
          <div className="mx-2 h-5 w-px bg-[#e5e5e5]" />
          <span className="text-sm font-semibold" style={{ color: riskInfo.color }}>{riskInfo.emoji} {riskInfo.label}</span>
          {fileName && <span className="hidden text-xs text-[#6b6b6b] sm:inline">· {fileName}</span>}
          <div className="flex-1" />
          <button
            onClick={() => setShowMarks(v => !v)} aria-pressed={showMarks}
            className={cn('min-h-[44px] rounded-xl border px-3 py-2 text-xs font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-[#b00020]',
              showMarks ? 'border-[#b00020] bg-[#fff5f6] text-[#b00020]' : 'border-[#9a9a9a] bg-white text-[#6b6b6b] hover:bg-[#fafafa]')}>
            {showMarks ? '● Con marcas' : '○ Sin marcas'}
          </button>
          <button onClick={handlePrint} disabled={!canExport}
            className="flex min-h-[44px] items-center gap-1.5 rounded-xl border border-[#9a9a9a] bg-white px-3 py-2 text-xs font-semibold text-[#333333] hover:bg-[#fff5f6] transition disabled:opacity-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#b00020]">
            🖨 Imprimir / Guardar PDF
          </button>
          <AppButton onClick={() => canExport && downloadAnonText(anonText)} disabled={!canExport} className="text-xs">
            ↓ Descargar texto .txt
          </AppButton>
          <AppButton onClick={handleDownload} disabled={!canExport} variant="secondary" className="text-xs">
            ↓ Respaldo confidencial .doc
          </AppButton>
        </div>
        {!canExport && (
          <div className="border-t border-[#fecaca] bg-[#fef2f2] px-5 py-2 text-xs font-semibold text-[#dc2626]">
            Exportación deshabilitada hasta retirar las coincidencias pendientes y confirmar la revisión manual.
          </div>
        )}
      </div>

      <div className="shrink-0 px-5 py-2"><RiskSemaphore text={anonText} reviewed={reviewed} onReview={setReviewed} riskData={riskData} /></div>
      {/* Paper scroll area */}
      <div className="flex-1 overflow-y-auto py-8 px-4">
        <div className="mx-auto max-w-3xl rounded-sm bg-white shadow-xl" style={{ padding: 'clamp(16px, 5vw, 3cm) clamp(16px, 6vw, 3.5cm)', minHeight: 'min(27cm, 80vh)' }}>
          {/* Doc header */}
          <div className="mb-6 border-b border-[#e5e5e5] pb-4">
            <div className="text-xs text-[#6b6b6b]">FuturIA Anonimizador IA &nbsp;·&nbsp; {new Date().toLocaleDateString('es')}</div>
            {fileName && <div className="mt-0.5 text-xs text-[#6b6b6b]">Archivo: {fileName}</div>}
          </div>

          {/* Body */}
          <DocumentBody text={anonText} reps={reps} cats={cats} showMarks={showMarks} />

          {/* Doc footer */}
          <div className="mt-8 border-t border-[#e5e5e5] pt-4 text-xs text-[#6b6b6b]">
            Procesado 100% en navegador — sin servidores, sin historial automático. &nbsp; futuria.substack.com
          </div>
        </div>
      </div>
    </div>,
    document.body
  );
}

// ─── Extracción de texto de archivos ─────────────────────────────────────────

async function loadPdfJs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = window.PDFJS_CDN;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  // Fetch worker and create a blob URL to avoid CORS issues when running from file://
  try {
    const resp = await fetch(window.PDFJS_WORKER);
    if (resp.ok) {
      const text = await resp.text();
      const blob = new Blob([text], { type: 'application/javascript' });
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
    } else {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = window.PDFJS_WORKER;
    }
  } catch (_) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = window.PDFJS_WORKER;
  }
  return window.pdfjsLib;
}

async function loadMammoth() {
  if (window.mammoth) return window.mammoth;
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = window.MAMMOTH_CDN;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return window.mammoth;
}

async function extractTextFromFile(file, onProgress) {
  if (file.size > MAX_FILE_BYTES) {
    throw new Error(
      'El archivo pesa ' + formatMB(file.size) + ' y el máximo admitido es ' + MAX_FILE_MB + ' MB.\n\n' +
      'Todo el procesamiento ocurre en tu navegador, así que un archivo muy grande lo dejaría sin responder. ' +
      'Divide el documento o copia y pega el texto en la pestaña Texto.'
    );
  }
  if (file.size === 0) {
    throw new Error('El archivo está vacío (0 bytes).');
  }
  const ext = file.name.toLowerCase().split('.').pop();

  if (ext === 'txt' || ext === 'csv') {
    return await file.text();
  }

  if (ext === 'pdf') {
    onProgress('Cargando motor PDF…');
    const pdfjsLib = await loadPdfJs();
    const arrayBuffer = await file.arrayBuffer();
    onProgress('Abriendo documento PDF…');
    let pdf;
    try {
      pdf = await pdfjsLib.getDocument({ data: arrayBuffer, isEvalSupported: false }).promise;
    } catch (e) {
      throw new Error(
        'No se pudo abrir el PDF. Posibles causas: archivo protegido con contraseña, PDF corrupto o formato no estándar.\n\n' +
        'Alternativa: abre el PDF, selecciona todo (Ctrl+A), copia y pega el texto directamente en el área de texto.'
      );
    }
    try {
    const totalPages = pdf.numPages;
    if (totalPages > MAX_PDF_PAGES) {
      throw new Error(
        'El PDF tiene ' + totalPages + ' páginas y el máximo admitido es ' + MAX_PDF_PAGES + '.\n\n' +
        'Un documento tan largo bloquearía el navegador durante la extracción. ' +
        'Divídelo en partes y anonimiza cada una por separado.'
      );
    }
    let fullText = '';
    if (totalPages >= AVISO_PAGINAS) {
      onProgress('Documento de ' + totalPages + ' páginas — la extracción puede tardar…');
    }
    for (let i = 1; i <= totalPages; i++) {
      onProgress('Extrayendo página ' + i + ' de ' + totalPages + '…');
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += reconstructPageText(content.items);
      // Separador de página: línea en blanco, para que el visor abra párrafo nuevo.
      if (i < totalPages) fullText += '\n\n';
      // Ceder el hilo cada pocas páginas para que la interfaz siga respondiendo
      // y el contador de progreso se repinte de verdad en documentos largos.
      if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
    }
    const trimmed = fullText.trim();
    if (!trimmed) {
      throw new Error(
        'El PDF no contiene texto seleccionable — es un PDF escaneado (solo imágenes).\n\n' +
        'Alternativa: usa un OCR local autorizado por tu organización para convertirlo a texto; no subas información confidencial a un OCR online. ' +
        'luego pégalo aquí manualmente.'
      );
    }
    return trimmed;
    } finally {
      await pdf.destroy();
    }
  }

  if (ext === 'docx' || ext === 'doc') {
    onProgress('Cargando motor Word…');
    const mammoth = await loadMammoth();
    const arrayBuffer = await file.arrayBuffer();

    // El .doc binario legado (Word 97-2003) NO es OOXML: es un contenedor OLE2/CFB
    // que empieza por D0 CF 11 E0. mammoth solo lee .docx (un ZIP que empieza por
    // 50 4B = "PK"), así que con un .doc real lanza «Could not find the body
    // element: are you sure this is a docx file?» — un mensaje técnico en inglés
    // que no le dice nada a quien subió su archivo. Se detecta por la firma del
    // propio contenido, no por la extensión: un archivo renombrado miente.
    const firma = new Uint8Array(arrayBuffer.slice(0, 8));
    const esOLE2 = firma[0] === 0xd0 && firma[1] === 0xcf && firma[2] === 0x11 && firma[3] === 0xe0;
    const esZip = firma[0] === 0x50 && firma[1] === 0x4b;

    if (esOLE2) {
      throw new Error(
        'Este archivo es un .doc del formato antiguo de Word (97-2003), que esta herramienta no puede leer en el navegador.\n\n' +
        'Cómo resolverlo en 10 segundos: ábrelo en Word y usa «Archivo → Guardar como» eligiendo ' +
        '«Documento de Word (*.docx)». Vuelve a subirlo y funcionará.\n\n' +
        'Alternativa inmediata: abre el documento, selecciona todo (Ctrl+A), copia y pega el texto ' +
        'en la pestaña Texto.'
      );
    }
    if (!esZip) {
      throw new Error(
        'El archivo no parece un documento de Word válido, aunque su nombre termine en .' + ext + '.\n\n' +
        'Comprueba que no esté dañado ni renombrado desde otro formato. ' +
        'Si no, copia el texto y pégalo en la pestaña Texto.'
      );
    }

    onProgress('Extrayendo texto del documento…');
    const result = await mammoth.extractRawText({ arrayBuffer });
    return result.value;
  }

  throw new Error('Formato no compatible: .' + ext + '. Usa PDF, DOCX, TXT o CSV. El DOC antiguo requiere conversión a DOCX.');
}

function TemplatesPanel({ onSelect, onClose }) {
  const [search, setSearch] = React.useState('');
  const [activeCat, setActiveCat] = React.useState('all');

  const filtered = TEMPLATES.filter(t => {
    const matchCat = activeCat === 'all' || t.cat === activeCat;
    const q = search.toLowerCase();
    const matchSearch = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });

  const catDef = TEMPLATE_CATS.find(c => c.id === activeCat);

  // Cerrar con Escape, como cualquier ventana emergente.
  React.useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    // Bloquear el scroll del fondo mientras la ventana está abierta.
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, [onClose]);

  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
      role="dialog" aria-modal="true" aria-label="Plantillas de ejemplo"
      onClick={onClose}
    >
      <div
        className="flex max-h-[88vh] w-full max-w-5xl flex-col overflow-hidden rounded-[28px] border border-[#e5e5e5] bg-white shadow-2xl"
        onClick={e => e.stopPropagation()}
      >
        {/* Header */}
        <div className="flex shrink-0 items-center justify-between gap-4 border-b border-[#e5e5e5] bg-[#fff5f6] px-6 py-4">
          <div>
            <h3 className="font-bold text-[#222222]">📋 Plantillas de ejemplo</h3>
            <p className="text-xs text-[#757575] mt-0.5">{TEMPLATES.length} documentos reales · Haz clic en cualquiera para cargarlo</p>
          </div>
          <button onClick={onClose} className="rounded-xl border border-[#e5e5e5] bg-white px-3 py-1.5 text-xs font-semibold text-[#757575] hover:bg-[#fafafa]">
            × Cerrar
          </button>
        </div>

        {/* Search + category filter */}
        <div className="shrink-0 border-b border-[#e5e5e5] px-6 py-3 space-y-3">
          <input

function GrowingTextarea({ value, onChange, minRows = 3, maxRows = 14, className, visible = true, ...rest }) {
  const ref = useRef(null);
  React.useLayoutEffect(() => {
    const el = ref.current; if (!el || !visible || !el.offsetParent) return;
    el.style.height = 'auto';
    const line = parseFloat(getComputedStyle(el).lineHeight) || 22;
    const min = line * minRows + 24;
    const max = line * maxRows + 24;
    el.style.height = Math.max(min, Math.min(el.scrollHeight, max)) + 'px';
    el.style.overflowY = el.scrollHeight > max ? 'auto' : 'hidden';
  }, [value, visible]);
  return <textarea ref={ref} rows={minRows} value={value} onChange={onChange} className={className} {...rest} />;
}
